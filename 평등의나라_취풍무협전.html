:root{
  --bg:#1b1410; --frame:#c8933f; --frame2:#6e4a1f; --ink:#fff8e6; --muted:#d9c9a8;
  --win1:#2a3f9e; --win2:#101a5a; --winb:#f4ecd8; --gold:#ffd75e; --red:#ff6b5b; --green:#7be38a;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 50% 0%,#3a2716,#140d08 70%);color:var(--ink);font-family:NeoDunggeunmo,"Galmuri11","DungGeunMo",monospace;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.client{width:min(980px,100%,calc((100vh - 250px) * 1.5 + 20px));min-width:min(100%,560px);margin:8px auto;background:#2a1d12;border:3px solid var(--frame);box-shadow:0 0 0 3px #1a0f07,0 0 0 6px var(--frame2),0 18px 50px #000a;padding:0 8px 6px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;flex-wrap:wrap}
.title{font-size:26px;color:var(--gold);text-shadow:2px 2px 0 #7a2a10,4px 4px 0 #2a0f05;letter-spacing:3px}
.title span{font-size:14px;color:var(--muted);text-shadow:none;letter-spacing:1px;margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.hotkeys button,dialog button,.choice{background:linear-gradient(#5a3a1a,#3a240e);border:2px solid var(--frame);border-radius:3px;padding:5px 10px;font-size:13px;box-shadow:inset 0 1px 0 #ffffff30}
nav button:hover,.hotkeys button:hover,dialog button:hover{filter:brightness(1.25)}
.screen{position:relative;width:100%;aspect-ratio:3/2;background:#000;border:3px solid #120a04;outline:2px solid var(--frame);container-type:inline-size;overflow:hidden}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid var(--winb);border-radius:6px;box-shadow:0 0 0 2px #0b0f30,inset 0 0 0 1px #6a7ad8,3px 4px 0 #0008;color:#fff}
.zone{position:absolute;top:1.5cqw;left:50%;transform:translateX(-50%);padding:.5cqw 2cqw;font-size:clamp(11px,2.2cqw,20px);pointer-events:none;transition:opacity .6s}
.quest{position:absolute;top:1.2cqw;left:50%;transform:translateX(-50%);max-width:62cqw;padding:.7cqw 1.6cqw;font-size:clamp(10px,1.6cqw,15px);line-height:1.45;pointer-events:none;text-align:center;opacity:.93;white-space:nowrap}
.quest span{color:#c9cdf0}
.quest br{display:none}
.quest span::before{content:' · '}
.zone{display:none}
.quest b{color:var(--gold);display:block;margin-bottom:.15em;font-weight:normal}
/* 대화창 */
.dialog{position:absolute;left:2cqw;right:2cqw;bottom:2cqw;min-height:20cqw;display:flex;gap:2cqw;padding:1.6cqw 2cqw;align-items:flex-start;cursor:pointer;animation:pop .15s ease-out}
.dialog #face{width:14cqw;height:14cqw;min-width:56px;min-height:56px;image-rendering:pixelated;background:#0d1442;border:2px solid var(--winb);border-radius:4px;flex:none}
.dtext{flex:1}
.dtext b{color:var(--gold);font-size:clamp(12px,2.2cqw,20px);display:block;margin-bottom:.4em}
.dtext p{margin:0;font-size:clamp(12px,2.25cqw,21px);line-height:1.6;white-space:pre-wrap}
.dialog .next{position:absolute;right:2cqw;bottom:1cqw;color:var(--gold);animation:blink .7s steps(2) infinite;font-size:clamp(10px,1.8cqw,16px)}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
/* 전투 */
.battle{position:absolute;inset:0;pointer-events:none}
.battle>*{pointer-events:auto}
.bmsg{position:absolute;top:1.5cqw;left:2cqw;right:2cqw;padding:1cqw 2cqw;font-size:clamp(11px,2.1cqw,19px);text-align:center;min-height:5cqw;line-height:1.5}
.bmsg:empty{display:none}
.bbottom{position:absolute;left:1.5cqw;right:1.5cqw;bottom:1.5cqw;display:flex;gap:1.2cqw;align-items:flex-end}
.bcmd{flex:1;padding:1.2cqw 1.8cqw;font-size:clamp(11px,2.05cqw,19px);line-height:1.5;min-height:14cqw}
.bcmd .q{margin:0 0 .6em;color:#fff}
.bcmd .q small{color:var(--gold);display:block;margin-bottom:.2em}
.bcmd .explain{color:#ffe9a8;margin:.4em 0 0}
.bcmd .ok{color:var(--green)}.bcmd .ng{color:var(--red)}
.choice{display:block;width:100%;text-align:left;margin:.35em 0;background:#0c1550;border:2px solid #6a7ad8;font-size:inherit;padding:.35em .7em;border-radius:4px;line-height:1.35}
.choice.sel,.choice:hover{border-color:var(--gold);background:#2b3a9e;color:var(--gold)}
.choice.sel::before{content:"▶ ";}
.choice kbd{color:var(--gold);margin-right:.4em}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:.2em .8em}
.cmds .choice{margin:.15em 0}
.bparty{width:31cqw;padding:1cqw 1.4cqw;font-size:clamp(10px,1.7cqw,16px)}
.pm{display:grid;grid-template-columns:auto 1fr;gap:0 .6em;margin:.25em 0;align-items:center}
.pm b{grid-row:span 2;color:#fff;min-width:3.2em}
.pm.ko b{color:#888}
.pm .bar{height:.55em;background:#000;border:1px solid #8890c8;position:relative}
.pm .bar i{position:absolute;inset:0;background:linear-gradient(90deg,#3fd06a,#a8f07a);transform-origin:left}
.pm.low .bar i{background:linear-gradient(90deg,#e24a3b,#ff9a6b)}
.pm span{font-size:.85em;color:var(--muted)}
/* 챕터 카드 */
.chapter{position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqw;animation:fade 2.6s ease forwards;pointer-events:none;z-index:5}
.chapter small{color:var(--muted);font-size:clamp(12px,2.2cqw,20px);letter-spacing:.3em}
.chapter b{font-size:clamp(24px,6cqw,56px);color:var(--gold);text-shadow:3px 3px 0 #7a2a10;letter-spacing:.2em}
.chapter span{font-size:clamp(11px,2cqw,18px)}
@keyframes fade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
/* 타이틀 */
#splash{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#d2522a 0%,#7a1f12 35%,#2a0c06 80%);text-align:center}
#splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 14px,#0000000f 14px 15px);pointer-events:none}
.splashinner{position:relative;padding:2cqw}
.kicker{font-size:clamp(10px,1.8cqw,15px);color:#ffe2b0}
#splash h1{margin:1cqw 0 0;font-size:clamp(34px,10cqw,96px);color:#ffe066;text-shadow:4px 4px 0 #8a1c0a,8px 8px 0 #2a0904;letter-spacing:.15em;font-weight:normal}
#splash h2{margin:0 0 1cqw;font-size:clamp(16px,3.6cqw,34px);color:#fff;letter-spacing:.5em;font-weight:normal;text-shadow:2px 2px 0 #000}
#titleart{width:min(48cqw,420px);image-rendering:pixelated;display:block;margin:0 auto}
#splash p{font-size:clamp(11px,2cqw,18px);line-height:1.7;margin:1.4cqw 0}
#splash b{color:#ffe066;font-weight:normal}
#play{font-size:clamp(14px,2.6cqw,24px);padding:.5em 2em;background:linear-gradient(#ffd75e,#e09a2a);color:#3a1404;border:3px solid #fff3c4;border-radius:6px;box-shadow:0 4px 0 #7a3a0a;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#splash small{display:block;margin-top:1.4cqw;color:#ffd9b0;font-size:clamp(9px,1.6cqw,14px);line-height:1.6}
/* 콘솔 */
.console{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:8px}
.party{display:flex;gap:6px}
.card{flex:1;background:#1b120a;border:2px solid var(--frame2);padding:6px;display:flex;gap:6px;align-items:center;min-width:0}
.card canvas{width:40px;height:40px;image-rendering:pixelated;background:#0d1442;border:1px solid var(--frame);flex:none}
.card .info{flex:1;min-width:0;font-size:12px}
.card .info b{color:var(--gold);font-weight:normal}
.card meter{width:100%;height:9px}
.card.empty{opacity:.35;justify-content:center;font-size:12px}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
#inventory{margin:0;font-size:12px;color:var(--muted)}
.hotkeys{display:flex;gap:5px;flex-wrap:wrap}
.hotkeys button{font-size:12px;padding:3px 7px}
kbd{font:inherit;color:var(--gold);font-size:.85em}
.log{height:62px;overflow:auto;background:#120b06;border:2px solid var(--frame2);padding:3px 6px;font-size:12px;line-height:1.5}
.log p{margin:0}.log .gold{color:var(--gold)}.log .red{color:var(--red)}
footer{display:flex;justify-content:space-between;font-size:11px;color:#a08a68;padding:6px 2px 0}
/* 모달 */
dialog{max-width:min(640px,92vw);background:linear-gradient(180deg,var(--win1),var(--win2));color:#fff;border:3px solid var(--winb);border-radius:8px;padding:18px 22px;font-family:inherit;line-height:1.6;box-shadow:0 0 0 3px #0b0f30,0 20px 60px #000c}
dialog::backdrop{background:#000a}
dialog h2{color:var(--gold);font-weight:normal;margin:0 0 10px;font-size:22px}
dialog p{margin:8px 0}
dialog iframe{width:100%;aspect-ratio:16/9;border:0}
dialog a{color:var(--gold)}
#close{position:absolute;top:8px;right:8px;padding:0 9px}
.muted{color:#c9cdf0;font-size:13px}
.badgegrid{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.badgegrid span{border:2px solid #6a7ad8;padding:4px 10px;border-radius:4px;color:#8890c8}
.badgegrid span.on{border-color:var(--gold);color:var(--gold);background:#3a2f0a}
textarea{width:100%;min-height:80px;font:inherit;background:#0c1550;color:#fff;border:2px solid #6a7ad8;padding:8px}
.endart{display:block;width:100%;image-rendering:pixelated;margin:6px 0}
/* 터치 */
.touch{display:none;justify-content:space-between;align-items:center;padding:8px 6px 0}
.dpad{display:flex;flex-direction:column;align-items:center}
.dpad button,.abtn{width:52px;height:46px;background:#3a240e;border:2px solid var(--frame);color:var(--gold);font-size:18px;border-radius:6px;margin:2px;touch-action:manipulation}
.abtn{width:76px;height:76px;border-radius:50%;font-size:22px;line-height:1}
.abtn small{font-size:11px}
@media (pointer:coarse){.touch{display:flex}}
@media (max-width:700px){
  .client{padding:0 4px 4px;min-width:0}
  .console{grid-template-columns:1fr}
  .title{font-size:20px}
  .card canvas{width:32px;height:32px}
  .bparty{width:36cqw}
  .quest{white-space:normal}
}
</style>
</head>

        <button id="play">원정 시작</button>

        <button id="journal"><kbd>J</kbd> 수련 수첩</button>

  <footer>코믹 무협 도트 RPG · 첨부 학습지 기반 · 그래픽·음악 자체 제작 <span id="savestatus">자동 저장</span></footer>

<script>const stages=[
{name:'존중의 마을',icon:'🏯',seal:'🌿',power:'존중',x:16,y:69,desc:'상처를 주는 말의 안개를 걷어 주세요.',qs:[['정식이는 단톡방에서 어떤 특징 때문에 놀림을 받았나요?',['변성기의 목소리','좋아하는 운동','학교 준비물'],0,'학습지 속 정식이는 변성기의 목소리 때문에 조롱을 받았어요. 몸의 변화는 자연스럽고, 놀림의 대상이 아니에요.'],['친구의 목소리를 두고 “여자 같다”라며 놀리는 단톡방. 어떻게 할까요?',['웃는 이모티콘을 보낸다','“신체나 성별로 놀리는 건 옳지 않아”라고 말한다','다른 방에도 전달한다'],1,'차별적인 말에 동조하지 않고 멈추자고 말해요. 직접 말하기 어렵거나 안전하지 않다면 믿을 만한 어른에게 도움을 요청해도 좋아요.'],['상처받은 친구에게 전할 말로 가장 적절한 것은?',['장난인데 왜 그래?','네 목소리를 바꾸면 되잖아.','네 잘못이 아니야. 도움이 필요하면 함께할게.'],2,'피해를 받은 친구 탓으로 돌리지 말고, 마음을 존중하며 곁에서 도와주세요.']]},
{name:'비밀의 숲',icon:'🌲',seal:'🛡️',power:'보호',x:33,y:46,desc:'소중한 정보를 지키는 방패를 얻으세요.',qs:[['온라인에서 알게 된 사람이 학교, 학년, 사는 동네를 물어요. 이런 정보는 무엇인가요?',['신상정보','게임 점수','공개해도 되는 암호'],0,'학교, 학년, 사는 동네 등은 나를 알아볼 수 있는 신상정보예요. 온라인에서 만난 사람에게 알려주지 않아요.'],['게임 친구가 선물을 주겠다며 사진이나 동영상을 보내 달래요.',['선물을 받으니 보낸다','보내지 않고, 불편한 요청은 어른에게 알린다','친구의 사진을 대신 보낸다'],1,'온라인에서 만난 사람에게 내 사진이나 동영상을 보내지 않아요. 다른 사람의 사진도 함부로 보내면 안 돼요.'],['불법 촬영물을 단톡방에서 발견했어요. 어떻게 해야 할까요?',['다른 친구에게 보내 확인한다','호기심에 다운로드한다','보거나 저장·공유하지 않고 믿을 만한 어른에게 알린다'],2,'학습지는 불법 촬영물을 다운로드해 보거나 단톡방에 유포·공유하는 행동의 심각성을 강조해요. 더 퍼뜨리지 말고 도움을 요청해요.']]},
{name:'자유의 들판',icon:'🌸',seal:'🦋',power:'자유',x:48,y:69,desc:'성별에 관한 고정관념을 깨뜨리세요.',qs:[['성별과 관계없이 내가 진짜 좋아하는 색이나 장난감을 자유롭게 선택할 수 있다.',['O · 맞아요','X · 아니에요'],0,'“여자는 분홍색, 남자는 로봇”처럼 성별로 취향을 정하는 것은 고정관념이에요. 누구나 자신의 취향을 가질 수 있어요.'],['친구와 놀 때는 반드시 남자는 남자끼리, 여자는 여자끼리만 놀아야 한다.',['O · 맞아요','X · 아니에요'],1,'성별과 관계없이 관심사가 같은 친구와 다양하게 어울릴 수 있어요.'],['친구가 “남자는 울면 안 돼”라고 말해요. 평등한 생각은?',['누구나 슬플 때 울고 감정을 표현할 수 있어.','남자라면 참아야 해.','여자만 울 수 있어.'],0,'감정 표현도 성별로 제한할 수 없어요. 서로의 감정과 개성을 존중해요.']]},
{name:'용기의 다리',icon:'⛩️',seal:'🔥',power:'용기',x:66,y:34,desc:'혼자 참지 않는 용기로 다리를 건너세요.',qs:[['온라인에서 누군가 협박하거나 괴롭힐 때 가장 적절한 행동은?',['혼자 견딘다','부모님이나 선생님께 즉시 도움을 요청한다','요구하는 것을 계속 보낸다'],1,'혼자 해결하려고 애쓰지 않아도 돼요. 부모님이나 선생님처럼 믿을 수 있는 어른에게 즉시 도움을 요청해요.'],['디지털 세상에서 사용하지 않기로 약속할 말은?',['감사 표현','도움을 청하는 말','성별·외모·신체 조건에 대한 비하와 혐오 표현'],2,'누구나 존중받아야 해요. 성별이나 외모, 신체 조건을 이유로 비하하거나 혐오 표현을 사용하지 않아요.'],['괴롭힘을 말하기가 두려운 친구에게 어떻게 할까요?',['믿을 만한 어른에게 함께 도움을 청하자고 한다','절대로 아무에게도 말하지 말라고 한다','네가 알아서 하라고 한다'],0,'도움을 요청하는 일은 용기 있는 선택이에요. 친구가 안전하게 도움을 받을 수 있도록 함께해요.']]},
{name:'평등의 성',icon:'🏰',seal:'✨',power:'연대',x:85,y:22,desc:'배운 힘을 모아 마지막 수호 시험에 도전하세요.',qs:[['최종 시험 ① “장난이라면 친구의 신체적 특징을 놀려도 괜찮다.”',['O · 맞아요','X · 아니에요'],1,'장난이라는 말이 상처를 없애 주지는 않아요. 상대를 존중하고 놀림을 멈춰야 해요.'],['최종 시험 ② 안전과 평등을 모두 지키는 행동은?',['친구의 개인정보를 단톡방에 올린다','성별로 친구의 역할을 정한다','개인정보를 지키고 서로의 선택을 존중한다'],2,'개인정보 보호와 서로의 자유로운 선택을 존중하는 태도가 안전하고 평등한 디지털 세상을 만들어요.'],['최종 시험 ③ 디지털 수호자의 올바른 약속은?',['차별에 동조하지 않고, 위험할 때 도움을 요청한다','잘못된 행동을 봐도 무조건 모른 척한다','재미있으면 무엇이든 공유한다'],0,'존중, 보호, 자유, 용기, 연대의 힘을 일상에서 실천해 주세요. 우리 모두가 소중한 존재예요.']]}];

</script>
<script>// 이야기·캐릭터 데이터 (문항은 questions.js의 stages 사용)

const cache=new Map();
function overlay(rows,key){
 const a=rows.map(r=>r.split(''));

 if(key==='bomi'){ // 포니테일
  for(let y=3;y<10;y++){set(14,y,'h');} set(15,5,'h');set(15,6,'h');set(13,9,'b');
 }

  set(1,11,'c');set(14,11,'c');set(1,12,'s');set(14,12,'s');
 }
 if(key==='master'){ // 흰 수염
  for(const [x,y] of [[5,9],[6,9],[7,9],[8,9],[9,9],[10,9],[6,10],[7,10],[8,10],[9,10],[7,11],[8,11]])set(x,y,'w2');

function render(rows,pal,key){

 g.fillStyle=pal.o||'#2a1a12';
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=grid[y][x];if(ch!=='.'&&color(ch)){for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;const n=grid[ny]&&grid[ny][nx];if(!n||n==='.')g.fillRect(nx+1,ny+1,1,1)}}}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=grid[y][x];const col=ch!=='.'&&color(ch);if(col){g.fillStyle=col;g.fillRect(x+1,y+1,1,1)}}
 // 하이라이트

function get(key,pose,frame=0,stage=0){

 if(key==='goblin'||key==='fox'||key==='boss'){

 ctx.restore();
}

function ensure(){

}
let noiseBuf=null;
function tone(wave,m,t,dur,vol,dest){
 if(m==null)return;
 const g=ac.createGain();g.connect(dest||master);
 let src;
 if(wave==='noise'){
  if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  src=ac.createBufferSource();src.buffer=noiseBuf;dur=Math.min(dur,.06);
 }else{src=ac.createOscillator();src.type=wave;src.frequency.value=440*Math.pow(2,(m-69)/12)}
 g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur*.98);
 src.connect(g);src.start(t);src.stop(t+dur);
}
function tick(){

 const ahead=ac.currentTime+.25,eighth=60/song.bpm/2;let done=true;
 for(const tr of tracks){
  while(tr.t<ahead){
   if(tr.i>=tr.seq.length){if(song.once){tr.t=Infinity;break}tr.i=0}
   const [m,d]=tr.seq[tr.i++];tone(tr.wave,m,tr.t,d*eighth*.95,tr.vol);tr.t+=d*eighth;
  }
  if(tr.t!==Infinity)done=false;
 }
 if(done&&song.once){const next=song.next;song=null;cur='';if(next)play(next)}
}
function play(name,next){

 if(!enabled){song=null;return}
 if(!ensure())return;ac.resume&&ac.resume();
 song={...SONGS[name],next};const t0=ac.currentTime+.08;
 tracks=song.tracks.map(tr=>({...tr,i:0,t:t0}));
 if(!timer)timer=setInterval(tick,40);
 tick();
}
function stop(){song=null;cur=''}
function setEnabled(v){enabled=v;if(!v){const c=cur;stop();cur=c;if(master)master.gain.value=0}else{if(master)master.gain.value=.8;const c=cur;cur='';if(c)play(c)}}
function sfx(kind){

 const S={
  select:[['square',84,0,.05,.04]],

  hurt:[['square',52,0,.09,.06],['square',47,.08,.12,.06],['noise',60,0,.06,.08]],
  wrong:[['sawtooth',46,0,.16,.05],['sawtooth',45,.16,.22,.05]],
  heal:[['triangle',72,0,.08,.1],['triangle',76,.07,.08,.1],['triangle',79,.14,.08,.1],['triangle',84,.21,.16,.1]],
  chime:[['triangle',84,0,.2,.1],['triangle',88,.12,.2,.1],['triangle',91,.24,.4,.1]],
  door:[['square',60,0,.06,.05],['square',67,.07,.06,.05],['square',72,.14,.12,.05]],
  encounter:[['square',72,0,.05,.05],['square',76,.05,.05,.05],['square',79,.1,.05,.05],['square',84,.15,.05,.05],['noise',60,.2,.1,.08]],
  bump:[['square',40,0,.04,.04]]
 }[kind]||[];
 for(const [w,m,dt,d,v] of S)tone(w,m,t+dt,d,v);
}

<script>// 평등의 나라 · 취풍 무협전 — 필드 이동 + 사이드뷰 턴제 전투

let mode='title',grid=null,mapImg=null,E=null,keys={},path=[],pendingTarget=null,lastMove=0,cooldown=0,now=0,trans=null,dialog=null,B=null,shake=0,floaters=[];

function josa(w,pair){const c=w.charCodeAt(w.length-1)-0xac00;const has=c>=0&&c<=11171&&c%28!==0;const [a,b]=pair.split('/');return w+(has?a:b)}

function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296}

function makeMap(stage){
 const a=Array.from({length:H},()=>Array(W).fill(0));

 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  if(x===0||y===0||x===W-1||y===H-1)a[y][x]=1;

 }
 for(let y=1;y<H-1;y++){a[y][15]=2;a[y][16]=2}
 for(let x=1;x<W-1;x++)for(let y=9;y<=11;y++)a[y][x]=(x===15||x===16)?3:4;
 for(let y=2;y<=17;y++){a[y][4]=4;a[y][25]=4}
 for(let y=3;y<6;y++)for(let x=3;x<7;x++)a[y][x]=5;
 if(stage===0||stage===4)for(let y=13;y<16;y++)for(let x=19;x<23;x++)a[y][x]=5;
 for(const [x,y] of [[4,13],[7,11],[10,7],[11,14],[10,8],[11,13],[23,8],[26,4],[24,16]])for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X>0&&X<W-1&&Y>0&&Y<H-1&&(a[Y][X]===1||a[Y][X]===5&&!(stage===0||stage===4)))a[Y][X]=0}

function loadStage(){
 grid=makeMap(S.stage);mapImg=renderMap(S.stage);

function bfs(start,goal,adjOK){
 const q=[start],seen=new Set([start.join()]),prev={};
 while(q.length){const p=q.shift();
  const done=adjOK?Math.abs(p[0]-goal[0])+Math.abs(p[1]-goal[1])===1:(p[0]===goal[0]&&p[1]===goal[1]);
  if(done){const out=[];let k=p.join();while(k!==start.join()){out.unshift(k.split(',').map(Number));k=prev[k]}return out}
  for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const x=p[0]+dx,y=p[1]+dy,k=x+','+y;if(!seen.has(k)&&walkable(x,y)){seen.add(k);prev[k]=p.join();q.push([x,y])}}
 }

}

function renderMap(stage){
 const c=document.createElement('canvas');c.width=W*T;c.height=H*T;const g=c.getContext('2d');const th=THEMES[stage];

   if(grid[y][x-1]!==2&&grid[y][x-1]!==3)px(X,Y,2,T,'#ffffff55');if(grid[y][x+1]!==2&&grid[y][x+1]!==3)px(X+T-2,Y,2,T,'#00000033');continue}
  if(v===3){px(X,Y,T,T,'#8a5a2a');for(let i=0;i<T;i+=4){px(X+i,Y,3,T,'#b07a3a');px(X+i+3,Y,1,T,'#5a3a1a')}
   if(y===9)px(X,Y,T,3,'#5a3a1a');if(y===11)px(X,Y+T-3,T,3,'#5a3a1a');continue}
  const gc=th.grass;px(X,Y,T,T,gc[0]);
  for(let i=0;i<5;i++){const r=hash(x,y,i);const r2=hash(y,x,i+3);px(X+((r*15)|0),Y+((r2*15)|0),1,1,i%2?gc[1]:gc[2])}
  if(hash(x,y,99)<.25){px(X+5,Y+9,1,2,gc[1]);px(X+7,Y+8,1,3,gc[1]);px(X+9,Y+9,1,2,gc[1])}
  if(v===4){px(X,Y,T,T,th.path);for(let i=0;i<4;i++){const r=hash(x,y,i+20),r2=hash(y,x,i+30);px(X+((r*14)|0),Y+((r2*14)|0),2,1,th.pathD)}
   for(const [dx,dy,ex,ey,ew,eh] of [[0,-1,0,0,T,1],[0,1,0,T-1,T,1],[-1,0,0,0,1,T],[1,0,T-1,0,1,T]]){const n=grid[y+dy]&&grid[y+dy][x+dx];if(n!==4&&n!==3&&n!==undefined)px(X+ex,Y+ey,ew,eh,th.pathD)}}
  if(v===6){for(let i=0;i<3;i++){const r=hash(x,y,i+40),r2=hash(y,x,i+41);const fx=X+2+((r*11)|0),fy=Y+2+((r2*11)|0);px(fx,fy,3,1,th.flower[i%3]);px(fx+1,fy-1,1,3,th.flower[i%3]);px(fx+1,fy,1,1,'#ffe066')}}
 }
 // 장애물(나무 등) & 집
 const houses=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=grid[y][x];if(v===1)drawTree(g,x*T,y*T,th,stage,x,y);if(v===5&&!(grid[y-1]&&grid[y-1][x]===5)&&!(grid[y][x-1]===5))houses.push([x,y])}

  say([['sys',`수호 비석 · ${stages[S.stage].power}의 가르침\n「${STELE_TITLE[S.stage]}」`],['sys',stages[S.stage].qs[2][3]],['sys',`비석에 빛이 깃들었다! ${josa(ENEMY_NAMES[S.stage][2],'의/의')} 봉인이 풀렸다. (회복약 +1 · 체력 +30)`]],()=>log('봉인이 풀렸다! 보스를 찾아가자.','gold'));
  return;
 }
 if(e.kind==='gate'){
  if(!S.kills.includes(2)){say([['sys','성문이 굳게 닫혀 있다. 이 고을의 보스를 먼저 물리치자.']]);return}
  Music.sfx('door');

  fadeTo(()=>{S.stage++;S.kills=[];S.talked=false;S.shrine=false;pl.x=4;pl.y=13;pl.dir='down';healAll();loadStage();save();chapterCard();Music.play('field')});

function loadStageKeepPos(){const keep=followers;loadStage();followers.forEach(f=>{const o=keep.find(k=>k.i===f.i);if(o)Object.assign(f,{x:o.x,y:o.y,fx:o.fx,fy:o.fy});else{f.x=E.npc.x;f.y=E.npc.y;f.fx=f.x;f.fy=f.y}})}
function face(e){const dx=e.x-pl.x,dy=e.y-pl.y;if(Math.abs(dx)>Math.abs(dy))pl.dir=dx>0?'right':'left';else if(dy)pl.dir=dy>0?'down':'up'}
function chapterCard(){const c=$('#chapter');$('#chapNo').textContent=`제 ${S.stage+1} 장`;$('#chapName').textContent=stages[S.stage].name;$('#chapDesc').textContent=stages[S.stage].desc;c.hidden=true;void c.offsetWidth;c.hidden=false;clearTimeout(chapterCard.t);chapterCard.t=setTimeout(()=>c.hidden=true,2700);log(`제${S.stage+1}장 · ${stages[S.stage].name}에 도착했다.`,'gold')}

// ---------- 필드 이동 ----------
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryStep(dir){
 pl.dir=dir;const [dx,dy]=DIRS[dir];const nx=pl.x+dx,ny=pl.y+dy;
 const e=entAt(nx,ny);
 if(e){path=[];if((e.kind==='mob'&&performance.now()>cooldown)||(e.kind==='gate'&&S.kills.includes(2)))interact(e);else if(now-lastBump>250){Music.sfx('bump');lastBump=now}return false}
 if(!walkable(nx,ny)){if(now-lastBump>250){Music.sfx('bump');lastBump=now}return false}
 // 동료 따라오기
 let px=pl.x,py=pl.y;for(const f of followers){const ox=f.x,oy=f.y;f.fx=f.x;f.fy=f.y;f.x=px;f.y=py;px=ox;py=oy}
 pl.fx=pl.x;pl.fy=pl.y;pl.x=nx;pl.y=ny;pl.t=0;pl.step++;
 if(pl.step%8===0)save();
 return true;
}
let lastBump=0;
function updateField(dt){
 if(pl.t<1){pl.t=Math.min(1,pl.t+dt/STEP_MS);if(pl.t<1)return}
 const k=keys;let dir=k.ArrowUp||k.w||k.W?'up':k.ArrowDown||k.s||k.S?'down':k.ArrowLeft||k.a||k.A?'left':k.ArrowRight||k.d||k.D?'right':null;
 if(dir){path=[];pendingTarget=null;tryStep(dir);hudCoords();return}
 if(path.length){const [nx,ny]=path.shift();const d=nx>pl.x?'right':nx<pl.x?'left':ny>pl.y?'down':'up';if(!tryStep(d)){path=[]}
  if(!path.length&&pendingTarget&&mode==='field'){const t=pendingTarget;pendingTarget=null;if(Math.abs(t.x-pl.x)+Math.abs(t.y-pl.y)===1)interact(t)}}
}
function hudCoords(){}
function updateMobs(t){
 for(const m of E.mobs){
  if(S.kills.includes(m.id))continue;
  if(t<m.next||m.id===2)continue;
  m.next=t+700+Math.random()*900;
  const opts=[[0,1],[1,0],[0,-1],[-1,0]].map(([dx,dy])=>[m.x+dx,m.y+dy]).filter(([x,y])=>Math.abs(x-m.hx)<=2&&Math.abs(y-m.hy)<=2&&walkable(x,y,true)&&!entAt(x,y)&&!followers.some(f=>f.x===x&&f.y===y));
  if(!opts.length)continue;const [x,y]=opts[(Math.random()*opts.length)|0];
  if(x===pl.x&&y===pl.y){if(S.talked&&t>cooldown&&mode==='field'&&pl.t>=1){Music.sfx('encounter');interact(m)}continue}
  m.fx=m.x;m.fy=m.y;m.x=x;m.y=y;m.t=0;
 }
}

// ---------- 그리기: 필드 ----------
function lerp(a,b,t){return a+(b-a)*t}
function drawField(t){
 ctx.drawImage(mapImg,0,0);
 // 물결 반짝임
 ctx.fillStyle=THEMES[S.stage].waterL;
 for(let y=1;y<H-1;y++){if(y>=9&&y<=11)continue;for(const x of [15,16]){const o=((t/120+y*5+x*3)|0)%16;ctx.fillRect(x*T+o,y*T+((y*7)%13),3,1)}}
 const list=[];
 const st=S.stage;
 // NPC
 const npcKey=st===1&&!S.talked?'bomi':st===2&&!S.talked?'gomdol':(st===1||st===2)?'fire':'master';
 list.push({y:E.npc.y,draw:()=>{const X=E.npc.x*T+8,Y=E.npc.y*T+16;if(npcKey==='fire')drawFire(X,Y,t);else Sprites.draw(ctx,npcKey,'front',X,Y+1+(((t/600)|0)%2),1,{})}});
 // 비석
 list.push({y:E.stele.y,draw:()=>drawStele(E.stele.x*T+8,E.stele.y*T+16,t)});
 // 성문
 list.push({y:E.gate.y,draw:()=>drawGate(E.gate.x*T+8,E.gate.y*T+16,t)});
 // 몬스터
 for(const m of E.mobs){if(S.kills.includes(m.id))continue;
  const X=lerp(m.fx,m.x,m.t)*T+8,Y=lerp(m.fy,m.y,m.t)*T+16;const type=ENEMY_TYPES[m.id];
  list.push({y:m.y,draw:()=>{const bob=Math.sin(t/200+m.id)*1;if(m.id===2){Sprites.draw(ctx,type,'front',X,Y+2,1.4,{stage:st,frame:0});if(!S.shrine){ctx.strokeStyle=`rgba(190,110,255,${.5+Math.sin(t/150)*.3})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(X,Y-10,14,15,0,0,Math.PI*2);ctx.stroke()}}else Sprites.draw(ctx,type,'front',X,Y+1+bob,1,{stage:st})}});
 }
 // 동료 & 주인공
 const pt=pl.t;
 for(const f of followers){const X=lerp(f.fx,f.x,pt)*T+8,Y=lerp(f.fy,f.y,pt)*T+16;const dir=f.x>f.fx?'right':f.x<f.fx?'left':f.y<f.fy?'up':'down';list.push({y:f.y-.01,draw:()=>drawWalker(MEMBERS[f.i].key,dir,X,Y,pt<1?pl.step:0)})}
 const PX=lerp(pl.fx,pl.x,pt)*T+8,PY=lerp(pl.fy,pl.y,pt)*T+16;
 list.push({y:pl.y+.01,draw:()=>drawWalker('baram',pl.dir,PX,PY,pt<1?pl.step:0)});
 list.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
 // 목표 표시
 const goal=currentGoal();if(goal){const bob=Math.sin(t/180)*2;const X=goal.x*T+8,Y=goal.y*T-(goal.kind==='gate'?26:goal.kind==='mob'&&goal.id===2?22:6)+bob;ctx.fillStyle='#2a1a0a';ctx.fillRect(X-4,Y-6,9,5);ctx.fillRect(X-2,Y-1,5,2);ctx.fillStyle='#ffd75e';ctx.fillRect(X-3,Y-5,7,3);ctx.fillRect(X-1,Y-2,3,2)}
}
function currentGoal(){if(S.finished)return null;if(!S.talked)return E.npc;const m=E.mobs.find(m=>m.id<2&&!S.kills.includes(m.id));if(m)return m;if(!S.shrine)return E.stele;if(!S.kills.includes(2))return E.mobs[2];return E.gate}
function drawWalker(key,dir,X,Y,step){
 const pose=dir==='up'?'back':dir==='down'?'front':'side';const frame=step%2;
 Sprites.draw(ctx,key,pose,X,Y+1-(step?frame:0),1,{frame,flip:dir==='right'});
}
function drawFire(X,Y,t){const f=((t/120)|0)%3;ctx.fillStyle='#5a3a1a';ctx.fillRect(X-6,Y-3,12,3);ctx.fillStyle='#e8481a';ctx.fillRect(X-4,Y-9-f,8,6+f);ctx.fillStyle='#ffd75e';ctx.fillRect(X-2,Y-7-f%2,4,4);ctx.fillStyle='#fff6c0';ctx.fillRect(X-1,Y-5,2,2)}
function drawStele(X,Y,t){
 const ready=S.talked&&S.kills.includes(0)&&S.kills.includes(1);
 if(ready||S.shrine){ctx.fillStyle=S.shrine?`rgba(255,215,94,${.25+Math.sin(t/300)*.1})`:`rgba(150,220,255,${.3+Math.sin(t/150)*.2})`;ctx.beginPath();ctx.arc(X,Y-10,13,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle='#2a2a32';ctx.fillRect(X-6,Y-21,12,20);ctx.fillStyle='#8a8f9a';ctx.fillRect(X-5,Y-20,10,18);ctx.fillStyle='#b8bcc6';ctx.fillRect(X-5,Y-20,10,2);
 ctx.fillStyle=S.shrine?'#ffd75e':'#5a5f6a';for(let i=0;i<4;i++)ctx.fillRect(X-3,Y-16+i*3,6,1);
 ctx.fillStyle='#5a4a3a';ctx.fillRect(X-8,Y-3,16,3);
}
function drawGate(X,Y,t){
 const open=S.kills.includes(2);
 ctx.fillStyle='#1a0a0a';ctx.fillRect(X-13,Y-26,3,26);ctx.fillRect(X+10,Y-26,3,26);
 ctx.fillStyle='#c8302a';ctx.fillRect(X-12,Y-25,2,25);ctx.fillRect(X+10,Y-25,2,25);
 ctx.fillStyle=open?`rgba(255,240,170,${.6+Math.sin(t/200)*.3})`:'#6a3a1a';ctx.fillRect(X-10,Y-22,20,22);
 if(!open){ctx.fillStyle='#4a2a10';ctx.fillRect(X,Y-22,1,22);ctx.fillStyle='#ffd75e';ctx.fillRect(X-3,Y-12,2,2);ctx.fillRect(X+2,Y-12,2,2)}
 ctx.fillStyle='#1a1a2a';ctx.fillRect(X-17,Y-31,34,5);ctx.fillRect(X-19,Y-33,4,3);ctx.fillRect(X+15,Y-33,4,3);
 ctx.fillStyle='#2a6a5a';ctx.fillRect(X-16,Y-30,32,3);ctx.fillStyle='#ffd75e';ctx.fillRect(X-5,Y-27,10,3);
}

// ---------- 전투 ----------
const BPOS=[{x:372,y:138},{x:414,y:118},{x:428,y:156}];
function startBattle(m){
 const boss=m.id===2;
 B={m,id:m.id,boss,stage:S.stage,name:ENEMY_NAMES[S.stage][m.id],type:ENEMY_TYPES[m.id],max:boss?300:100,hp:boss?300:100,qs:boss?[0,1,2]:[m.id],qn:0,phase:'intro',sel:0,order:null,anim:null,hitCount:0,eFlash:0,eShake:0,eAlpha:1,ex:110,ey:150,pFlash:[0,0,0],pOff:[0,0,0],fx:[]};
 mode='battle';keys={};path=[];dialog=null;$('#dialog').hidden=true;
 Music.sfx('encounter');

function bCommand(){
 B.phase='cmd';bParty();
 const q=B.boss?` · 시험 ${B.qn+1} / 3`:'';

function bQuiz(){
 B.phase='quiz';const q=stages[S.stage].qs[B.qs[B.qn]];
 const order=q[1].map((v,i)=>({v,i}));for(let j=order.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}
 B.order=order;

function bAnswer(choice){
 const q=stages[S.stage].qs[B.qs[B.qn]];$('#bcmd').innerHTML='';B.phase='anim';
 if(choice===q[2]){
  S.right++;
  const alive=partyIdx().filter(i=>S.hp[i]>0);
  const finale=B.boss&&B.hp<=100;
  const who=finale&&alive.length>1?alive:[alive[B.hitCount%alive.length]];
  B.hitCount++;
  const moveName=finale&&who.length>1?`${stages[S.stage].power} 합격기 · 다 함께!`:MEMBERS[who[0]].move.replace('{p}',stages[S.stage].power);
  bMsg(`${who.map(i=>MEMBERS[i].name).join('·')}의 「${moveName}」!`);
  Music.sfx('ok');
  B.anim={kind:'attack',who,t0:performance.now(),dur:900,hitAt:420,hit:false,after:()=>{
   B.hp=Math.max(0,B.hp-100);
   $('#bcmd').innerHTML=`<p class="q ok"><small>정답!</small>${q[1][q[2]]}</p><p class="explain">${q[3]}</p><button class="choice sel" data-act="next">${B.hp<=0?'승리!':'계속하기'}</button>`;
   bMsg(`${B.name}에게 100 피해! (남은 체력 ${B.hp} / ${B.max})`);
   bindChoices(()=>{if(B.hp<=0)bVictory();else{B.qn++;bCommand()}});
  }};
 } else {
  S.wrong++;
  const alive=partyIdx().filter(i=>S.hp[i]>0);const target=alive[(Math.random()*alive.length)|0];
  bMsg(`앗, 기술이 꼬였다! ${B.name}의 반격!`);Music.sfx('wrong');

   bindChoices(()=>{if(allKO)bDefeat();else bCommand()});
  }};
 }
 save();
}

 let extra='';if(B.boss){S.potions+=1;extra=' · 회복약 +1 · 수호 인장 획득!'}

 $('#promise').onclick=()=>{S.pledge=$('#pledge').value.trim().slice(0,300);save();const url=URL.createObjectURL(new Blob([`평등의 나라 · 취풍 무협전 원정 기록\n완료: 5개 고을 / 수호 인장 5개\n레벨 ${level()} · 경험치 ${S.xp}\n정답 필살기 ${S.right}회 · 오답 ${S.wrong}회 · 물리친 요괴 ${S.defeated}마리\n배운 힘: 존중 · 보호 · 자유 · 용기 · 연대\n나의 약속: ${S.pledge}`],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='평등의나라_원정기록.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#promise').textContent='약속 저장 완료 · 다시 내려받기'};
}

// ---------- 타이틀 ----------
function titleArt(){const c=$('#titleart'),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,160,40);
 [['goblin',22,1],['baram',62,0],['bomi',84,0],['gomdol',106,0],['fox',140,1]].forEach(([k,x,e])=>{const img=Sprites.get(k,'front',0,e?S.stage:0);g.drawImage(img,x-img.width,38-img.height*2,img.width*2,img.height*2)})}
$('#play').onclick=()=>{
 $('#splash').remove();mode='field';Music.setEnabled(S.sound);loadStage();
 if(S.finished){Music.play('ending');ending()}else{Music.play('field');chapterCard();if(!S.talked&&S.stage===0&&!S.xp)setTimeout(()=>{if(mode==='field'&&!S.talked)say([['baram','하아암~ 잘 잤다. …응? 사부님이 길 위에서 손짓하고 계시네.'],['sys','방향키(WASD)로 걸어가서 Space로 말을 걸자. 노란 화살표가 목표야!']])},1600)}
 cv.focus();
};
document.fonts&&document.fonts.ready.then(titleArt);titleArt();
grid=makeMap(S.stage);mapImg=renderMap(S.stage);
loadStage();hud();
requestAnimationFrame(frame);
