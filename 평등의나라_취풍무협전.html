:root{
  --bg:#1b1410; --frame:#c8933f; --frame2:#6e4a1f; --ink:#fff8e6; --muted:#d9c9a8;
  --win1:#2a3f9e; --win2:#101a5a; --winb:#f4ecd8; --gold:#ffd75e; --red:#ff6b5b; --green:#7be38a;
}
*{box-sizing:border-box}
/* hidden 속성이 display:flex 등에 덮이지 않도록 (대화창이 남아 화면이 멈춰 보이던 문제) */
[hidden]{display:none!important}
html,body{margin:0;background:radial-gradient(circle at 50% 0%,#3a2716,#140d08 70%);color:var(--ink);font-family:NeoDunggeunmo,"Galmuri11","DungGeunMo",monospace;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.client{width:min(980px,100%,calc((100vh - 250px) * 1.5 + 20px));min-width:min(100%,560px);margin:8px auto;background:#2a1d12;border:3px solid var(--frame);box-shadow:0 0 0 3px #1a0f07,0 0 0 6px var(--frame2),0 18px 50px #000a;padding:0 8px 6px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;flex-wrap:wrap}
.title{font-size:26px;color:var(--gold);text-shadow:2px 2px 0 #7a2a10,4px 4px 0 #2a0f05;letter-spacing:3px}
.title span{font-size:14px;color:var(--muted);text-shadow:none;letter-spacing:1px;margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.hotkeys button,dialog button,.choice{background:linear-gradient(#5a3a1a,#3a240e);border:2px solid var(--frame);border-radius:3px;padding:5px 10px;font-size:13px;box-shadow:inset 0 1px 0 #ffffff30}
nav button:hover,.hotkeys button:hover,dialog button:hover{filter:brightness(1.25)}
.screen{position:relative;width:100%;aspect-ratio:3/2;background:#000;border:3px solid #120a04;outline:2px solid var(--frame);container-type:inline-size;overflow:hidden}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid var(--winb);border-radius:6px;box-shadow:0 0 0 2px #0b0f30,inset 0 0 0 1px #6a7ad8,3px 4px 0 #0008;color:#fff}
.zone{position:absolute;top:1.5cqw;left:50%;transform:translateX(-50%);padding:.5cqw 2cqw;font-size:clamp(11px,2.2cqw,20px);pointer-events:none;transition:opacity .6s}
.quest{position:absolute;top:1.2cqw;left:50%;transform:translateX(-50%);max-width:72cqw;width:max-content;padding:.7cqw 1.6cqw;font-size:clamp(10px,1.6cqw,15px);line-height:1.45;pointer-events:none;text-align:center;opacity:.93}
.quest span{color:#c9cdf0}
.quest br{display:none}
.quest span::before{content:' · '}
.zone{display:none}
.quest b{color:var(--gold);display:block;margin-bottom:.15em;font-weight:normal}
/* 대화창 */
.dialog{position:absolute;left:2cqw;right:2cqw;bottom:2cqw;min-height:20cqw;display:flex;gap:2cqw;padding:1.6cqw 2cqw;align-items:flex-start;cursor:pointer;animation:pop .15s ease-out}
.dialog #face{width:14cqw;height:14cqw;min-width:56px;min-height:56px;image-rendering:pixelated;background:#0d1442;border:2px solid var(--winb);border-radius:4px;flex:none}
.dtext{flex:1}
.dtext b{color:var(--gold);font-size:clamp(12px,2.2cqw,20px);display:block;margin-bottom:.4em}
.dtext p{margin:0;font-size:clamp(12px,2.25cqw,21px);line-height:1.6;white-space:pre-wrap}
.dialog .next{position:absolute;right:2cqw;bottom:1cqw;color:var(--gold);animation:blink .7s steps(2) infinite;font-size:clamp(10px,1.8cqw,16px)}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
/* 전투 */
.battle{position:absolute;inset:0;pointer-events:none}
.battle>*{pointer-events:auto}
.bmsg{position:absolute;top:1.5cqw;left:2cqw;right:2cqw;padding:1cqw 2cqw;font-size:clamp(11px,2.1cqw,19px);text-align:center;min-height:5cqw;line-height:1.5}
.bmsg:empty{display:none}
.bbottom{position:absolute;left:1.5cqw;right:1.5cqw;bottom:1.5cqw;display:flex;gap:1.2cqw;align-items:flex-end}
.bcmd{flex:1;padding:1.2cqw 1.8cqw;font-size:clamp(11px,2.05cqw,19px);line-height:1.5;min-height:14cqw}
.bcmd .q{margin:0 0 .6em;color:#fff}
.bcmd .q small{color:var(--gold);display:block;margin-bottom:.2em}
.bcmd .explain{color:#ffe9a8;margin:.4em 0 0}
.bcmd .ok{color:var(--green)}.bcmd .ng{color:var(--red)}
.choice{display:block;width:100%;text-align:left;margin:.35em 0;background:#0c1550;border:2px solid #6a7ad8;font-size:inherit;padding:.35em .7em;border-radius:4px;line-height:1.35}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice.sel,.choice:hover{border-color:var(--gold);background:#2b3a9e;color:var(--gold)}
.choice.sel::before{content:"▶ ";}
.choice kbd{color:var(--gold);margin-right:.4em}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:.2em .8em}
.cmds .choice{margin:.15em 0}
.bparty{width:31cqw;padding:1cqw 1.4cqw;font-size:clamp(10px,1.7cqw,16px)}
.pm{display:grid;grid-template-columns:auto 1fr;gap:0 .6em;margin:.25em 0;align-items:center}
.pm b{grid-row:span 2;color:#fff;min-width:3.2em}
.pm.ko b{color:#888}
.pm .bar{height:.55em;background:#000;border:1px solid #8890c8;position:relative}
.pm .bar i{position:absolute;inset:0;background:linear-gradient(90deg,#3fd06a,#a8f07a);transform-origin:left}
.pm.low .bar i{background:linear-gradient(90deg,#e24a3b,#ff9a6b)}
.pm span{font-size:.85em;color:var(--muted)}
/* 전투 목록·기력 */
.clist{display:flex;flex-direction:column}
.clist .choice{margin:.2em 0}
.choice small{color:#c9cdf0;font-size:.8em;margin-left:.3em}
.choice.hintbtn{border-color:#c8b8ff;color:#e0d8ff}
.pm.act b{color:#7be3ff}
.ki{display:grid;grid-template-columns:auto 1fr auto;gap:.5em;align-items:center;margin-top:.3em;font-size:.9em;color:#c8b8ff}
.ki .bar{height:.55em;background:#000;border:1px solid #8890c8;position:relative}
.ki .bar i{position:absolute;inset:0;background:linear-gradient(90deg,#7a5aff,#c8b8ff);transform-origin:left}
/* 상점·가방 패널 */
.menuui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0007;z-index:4}
.mpanel{width:min(80cqw,620px);max-height:92%;overflow:auto;padding:1.8cqw 2.4cqw;font-size:clamp(11px,1.85cqw,17px);line-height:1.55}
.mpanel h3{margin:0 0 .3em;color:var(--gold);font-weight:normal;font-size:1.2em}
.mpanel p{margin:.35em 0}
.mpanel b{color:var(--gold);font-weight:normal}
.mbtns{display:flex;flex-direction:column}
.mbtns .choice{margin:.18em 0}
/* 외줄 수련 패널 */
.trialui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0007;z-index:4}
.tpanel{width:min(76cqw,600px);padding:2cqw 2.6cqw;font-size:clamp(11px,1.95cqw,18px);line-height:1.6}
.tpanel h3{margin:0 0 .4em;color:var(--gold);font-weight:normal;font-size:1.25em}
.tpanel p{margin:.45em 0}
.tpanel b{color:var(--gold);font-weight:normal}
.tpanel .keys{color:#ffe9a8}
/* 챕터 카드 */
.chapter{position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqw;animation:fade 2.6s ease forwards;pointer-events:none;z-index:5}
.chapter small{color:var(--muted);font-size:clamp(12px,2.2cqw,20px);letter-spacing:.3em}
.chapter b{font-size:clamp(24px,6cqw,56px);color:var(--gold);text-shadow:3px 3px 0 #7a2a10;letter-spacing:.2em}
.chapter span{font-size:clamp(11px,2cqw,18px)}
@keyframes fade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
/* 타이틀 */
#splash{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#d2522a 0%,#7a1f12 35%,#2a0c06 80%);text-align:center}
#splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 14px,#0000000f 14px 15px);pointer-events:none}
.splashinner{position:relative;padding:2cqw}
.kicker{font-size:clamp(10px,1.8cqw,15px);color:#ffe2b0}
#splash h1{margin:1cqw 0 0;font-size:clamp(34px,10cqw,96px);color:#ffe066;text-shadow:4px 4px 0 #8a1c0a,8px 8px 0 #2a0904;letter-spacing:.15em;font-weight:normal}
#splash h2{margin:0 0 1cqw;font-size:clamp(16px,3.6cqw,34px);color:#fff;letter-spacing:.5em;font-weight:normal;text-shadow:2px 2px 0 #000}
#titleart{width:min(48cqw,420px);image-rendering:pixelated;display:block;margin:0 auto}
#splash p{font-size:clamp(11px,2cqw,18px);line-height:1.7;margin:1.4cqw 0}
#splash b{color:#ffe066;font-weight:normal}
#play{font-size:clamp(14px,2.6cqw,24px);padding:.5em 2em;background:linear-gradient(#ffd75e,#e09a2a);color:#3a1404;border:3px solid #fff3c4;border-radius:6px;box-shadow:0 4px 0 #7a3a0a;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#splash small{display:block;margin-top:1.4cqw;color:#ffd9b0;font-size:clamp(9px,1.6cqw,14px);line-height:1.6}
/* 콘솔 */
.console{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:8px}
.party{display:flex;gap:6px}
.card{flex:1;background:#1b120a;border:2px solid var(--frame2);padding:6px;display:flex;gap:6px;align-items:center;min-width:0}
.card canvas{width:40px;height:40px;image-rendering:pixelated;background:#0d1442;border:1px solid var(--frame);flex:none}
.card .info{flex:1;min-width:0;font-size:12px}
.card .info b{color:var(--gold);font-weight:normal}
.card meter{width:100%;height:9px}
.card.empty{opacity:.35;justify-content:center;font-size:12px}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
#inventory{margin:0;font-size:12px;color:var(--muted)}
.hotkeys{display:flex;gap:5px;flex-wrap:wrap}
.hotkeys button{font-size:12px;padding:3px 7px}
kbd{font:inherit;color:var(--gold);font-size:.85em}
.log{height:62px;overflow:auto;background:#120b06;border:2px solid var(--frame2);padding:3px 6px;font-size:12px;line-height:1.5}
.log p{margin:0}.log .gold{color:var(--gold)}.log .red{color:var(--red)}
footer{display:flex;justify-content:space-between;font-size:11px;color:#a08a68;padding:6px 2px 0}
/* 모달 */
dialog{max-width:min(640px,92vw);background:linear-gradient(180deg,var(--win1),var(--win2));color:#fff;border:3px solid var(--winb);border-radius:8px;padding:18px 22px;font-family:inherit;line-height:1.6;box-shadow:0 0 0 3px #0b0f30,0 20px 60px #000c}
dialog::backdrop{background:#000a}
dialog h2{color:var(--gold);font-weight:normal;margin:0 0 10px;font-size:22px}
dialog p{margin:8px 0}
dialog iframe{width:100%;aspect-ratio:16/9;border:0}
dialog a{color:var(--gold)}
#close{position:absolute;top:8px;right:8px;padding:0 9px}
.muted{color:#c9cdf0;font-size:13px}
.badgegrid{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.badgegrid span{border:2px solid #6a7ad8;padding:4px 10px;border-radius:4px;color:#8890c8}
.badgegrid span.on{border-color:var(--gold);color:var(--gold);background:#3a2f0a}
textarea{width:100%;min-height:80px;font:inherit;background:#0c1550;color:#fff;border:2px solid #6a7ad8;padding:8px}
.endart{display:block;width:100%;image-rendering:pixelated;margin:6px 0}
/* 터치 */
.touch{display:none;justify-content:space-between;align-items:center;padding:8px 6px 0}
.dpad{display:flex;flex-direction:column;align-items:center}
.dpad button,.abtn{width:52px;height:46px;background:#3a240e;border:2px solid var(--frame);color:var(--gold);font-size:18px;border-radius:6px;margin:2px;touch-action:manipulation}
.abtn{width:76px;height:76px;border-radius:50%;font-size:22px;line-height:1}
.abtn small{font-size:11px}
@media (pointer:coarse){.touch{display:flex}}
@media (max-width:700px){
  .client{padding:0 4px 4px;min-width:0}
  .console{grid-template-columns:1fr}
  .title{font-size:20px}
  .card canvas{width:32px;height:32px}
  .bparty{width:36cqw}
  .quest{white-space:normal}
  .bcmd{min-height:0;padding:1cqw 1.4cqw;font-size:clamp(10px,2.6cqw,15px)}
  .bcmd .q{margin:0 0 .3em;line-height:1.35}
  .cmds{grid-template-columns:1fr 1fr 1fr;gap:.15em .4em}
  .choice{padding:.25em .45em;margin:.2em 0}
  .bmsg{font-size:clamp(10px,2.6cqw,15px);padding:.6cqw 1.4cqw}
  .bparty{font-size:clamp(9px,2.3cqw,13px)}
}

/* 교사용 */
.tbtn{border-color:#7be38a!important;color:#c8ffd0}
#teachbadge{color:#7be38a;margin-right:6px}
.classnote{background:#0b3a1a;border:2px solid #7be38a;color:#d8ffe0;padding:.5em .8em;border-radius:6px;font-size:clamp(11px,1.8cqw,15px)}
dialog.wide{max-width:min(860px,96vw);width:min(860px,96vw);max-height:92vh}
dialog h3{color:var(--gold);font-weight:normal;margin:14px 0 6px;font-size:17px}
dialog h3 small{color:#c9cdf0;font-size:12px}
.ttabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px;border-bottom:2px solid #6a7ad8;padding-bottom:6px}
.ttabs button{background:#0c1550;border:2px solid #6a7ad8;padding:5px 10px}
.ttabs button.on{border-color:var(--gold);color:var(--gold);background:#2b3a9e}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
dialog label{font-size:14px}
dialog select,dialog input[type=text],dialog input[type=password],dialog input:not([type]),dialog textarea{font:inherit;background:#0c1550;color:#fff;border:2px solid #6a7ad8;padding:5px 7px;border-radius:4px}
dialog textarea{width:100%;min-height:0}
label.blk{display:block;margin:6px 0}
label.chk{display:block;margin:4px 0}
dialog button.primary{background:linear-gradient(#ffd75e,#e09a2a);color:#3a1404;border-color:#fff3c4}
dialog button.mini{padding:2px 7px;font-size:12px}
.qch{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qch label{display:flex;gap:6px;align-items:center}
.qch input:not([type=radio]){flex:1;min-width:0}
.qch input[type=radio]{width:18px;height:18px;accent-color:#ffd75e}
.qlist{max-height:240px;overflow:auto;border:1px solid #6a7ad8;padding:4px 8px;border-radius:4px}
.qitem{padding:6px 0;border-bottom:1px dashed #4a5ab0;font-size:14px}
.qitem .tag{color:#3a1404;background:#ffd75e;padding:0 5px;border-radius:3px;font-size:12px}
.qitem small{color:#c9cdf0}
.qbtns{display:inline-flex;gap:4px;margin-left:6px}
.tmsg{font-size:13px}.tmsg.ok{color:#7be38a}.tmsg.ng{color:#ff9a8a}
.warn{color:#ffd0a0;font-size:13px}
.filebtn{display:inline-block;background:linear-gradient(#5a3a1a,#3a240e);border:2px solid var(--frame);border-radius:3px;padding:5px 10px;font-size:13px;cursor:pointer}
.filebtn input{display:none}
.ttable{border-collapse:collapse;font-size:14px;margin:4px 0}
.ttable th,.ttable td{border:1px solid #6a7ad8;padding:3px 10px;text-align:center}
details{margin-top:10px;font-size:14px}details summary{cursor:pointer;color:var(--gold)}
@media (max-width:700px){.qch{grid-template-columns:1fr}}

/* 우리 반 연동판 */
.cjoin{margin:1.2cqw auto;padding:.8em 1em;background:#1a0a05cc;border:2px solid #ffd75e;border-radius:8px;display:inline-block;font-size:clamp(11px,1.9cqw,16px)}
.cjoin b{color:#ffe066;font-weight:normal;display:block;margin-bottom:.3em}
.cjrow{display:flex;gap:6px;justify-content:center}
.cjoin input{font:inherit;width:11em;text-transform:uppercase;letter-spacing:.15em;text-align:center;background:#0c1550;color:#fff;border:2px solid #6a7ad8;border-radius:4px;padding:.3em .5em}
.cjoin button{font:inherit;background:linear-gradient(#ffd75e,#e09a2a);color:#3a1404;border:2px solid #fff3c4;border-radius:4px;padding:.3em .8em}
.cjoin small{display:inline;color:#ffd9b0;margin-top:.3em}
#cjoinstate{color:#7be38a}
#classbadge{color:#9ad8ff}
.synctoast{position:absolute;left:50%;top:13cqw;transform:translateX(-50%);z-index:6;background:#0b3a1a;border:2px solid #7be38a;color:#e0ffe8;padding:.6em 1.1em;border-radius:8px;font-size:clamp(11px,1.9cqw,16px);max-width:86%;text-align:center;box-shadow:0 4px 0 #0008;pointer-events:none}
.synctoast.show{animation:toast 5s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
.bigcode{font-size:44px;letter-spacing:.25em;color:var(--gold);text-align:center;background:#0c1550;border:3px solid var(--gold);border-radius:8px;padding:6px 0;margin:6px 0}
.secret{letter-spacing:.15em}
</style>

<body>
<main class="client">
  <header>
    <div class="title">평등의 나라 <span>취풍 무협전</span></div>
    <nav>
      <button id="help">도움말</button>
      <button id="video">학습 영상</button>
      <button id="sound">소리 ON</button>
      <button id="reset">새 게임</button>
      <button id="teacher" class="tbtn">교사용</button>
    </nav>
  </header>

  <section class="screen" id="screen">
    <canvas id="game" width="480" height="320" tabindex="0" aria-label="게임 화면. 방향키 또는 WASD 이동, Space 대화 및 결정"></canvas>

    <div class="chapter" id="chapter" hidden><small id="chapNo"></small><b id="chapName"></b><span id="chapDesc"></span></div>
    <div class="quest win" id="questbox"><b id="qtitle">임무</b><div id="quest"></div></div>
    <div class="zone" id="zone" hidden></div>

    <!-- 대화창 -->
    <div class="dialog win" id="dialog" hidden>
      <canvas id="face" width="40" height="40"></canvas>
      <div class="dtext"><b id="dname"></b><p id="dline"></p></div>
      <span class="next">▼</span>
    </div>

    <!-- 전투 UI -->
    <div class="battle" id="battleui" hidden>
      <div class="bmsg win" id="bmsg"></div>
      <div class="bbottom">
        <div class="bcmd win" id="bcmd"></div>
        <div class="bparty win" id="bparty"></div>
      </div>
    </div>

    <!-- 상점·가방 패널 -->
    <div class="menuui" id="menuui" hidden><div class="mpanel win" id="mpanel"></div></div>

    <!-- 외줄 수련 패널 -->
    <div class="trialui" id="trialui" hidden><div class="tpanel win" id="tpanel"></div></div>

    <!-- 타이틀 -->
    <div id="splash">
      <div class="splashinner">
        <span class="kicker">코믹 무협 도트 RPG · 양성평등 학습 모험</span>
        <h1>평등의 나라</h1>
        <h2>취풍 무협전</h2>
        <canvas id="titleart" width="160" height="40"></canvas>
        <p>편견의 요괴들이 다섯 고을을 뒤덮었다!<br>편지 줍기, 어둠의 미로, 바위 퍼즐, 몰래 잠입, 그림자 장수까지…<br><b>정답을 외치면 터지는 필살기</b>와 무기·도구로 세상을 구하라!</p>
        <p class="classnote" id="classnote" hidden></p>
        <button id="play">원정 시작</button>
        <small>방향키 / WASD 이동 · Space·Enter 대화/결정 · 숫자키로 정답 선택<br>마우스·터치로 바닥을 누르면 그곳으로 걸어갑니다.</small>
      </div>
    </div>
  </section>

  <section class="console">
    <div class="party" id="party"></div>
    <div class="side">
      <p id="inventory"></p>
      <div class="hotkeys">
        <button id="act"><kbd>SPACE</kbd> 대화·조사</button>
        <button id="potion"><kbd>1</kbd> 회복약</button>
        <button id="bag"><kbd>I</kbd> 가방</button>
        <button id="journal"><kbd>J</kbd> 수련 수첩</button>
      </div>
      <div class="log" id="log" role="log" aria-live="polite"></div>
    </div>
  </section>

  <div class="touch" id="touch">
    <div class="dpad">
      <button data-move="0,-1" aria-label="위">▲</button>
      <div><button data-move="-1,0" aria-label="왼쪽">◀</button><button data-move="0,1" aria-label="아래">▼</button><button data-move="1,0" aria-label="오른쪽">▶</button></div>
    </div>
    <button class="abtn" id="abtn">A<br><small>결정</small></button>
  </div>

  <footer>코믹 무협 도트 RPG · 첨부 학습지 기반 · 그래픽·음악 자체 제작 <span><span id="teachbadge" hidden></span> <span id="savestatus">자동 저장</span></span></footer>
</main>

<dialog id="modal"><button id="close" aria-label="닫기">×</button><div id="body"></div></dialog>

<script>// 외줄 수련 — 장대 위에서 방향키로 균형을 잡으며 장애물을 넘는 미니게임 (장마다 1회, 보스 결계를 푸는 시험)
const TRIAL={
 names:['존중의 장대','비밀의 외나무','자유의 꽃바람 다리','용기의 안개 줄','연대의 마지막 장대'],
 desc:[
  '굴러오는 「놀림 통」은 <b>점프</b>, 끊어진 곳도 <b>점프</b>! 옆에서 날아드는 <b>까마귀</b>는 <b>↓ 웅크리기</b>로 피하라.',
  '좌우로 나는 <b>도깨비불</b>, 기름칠한 <b>미끄러운 구간</b>(방향키가 잘 안 먹힘), 그림자가 생기면 <b>낙석</b>! ↑↓로 속도를 바꿔 피하라.',
  '<b>돌풍</b>에 <b>출렁다리</b>, 보라 안개 속에선 <b>좌우가 반대</b>! 뒤에서는 <b>먹구름</b>이 쫓아온다 — 멈추면 잡힌다!',
  '침묵의 <b>안개</b>에 <b>좁은 장대</b>(더 쉽게 기운다)까지! 먹구름은 더 빨라졌다. 동료들의 응원을 믿어라!',
  '지금까지의 모든 시련이 한꺼번에! 겹쳐 오는 통, 돌풍 속 낙석, 반대 안개 속 까마귀… <b>연대</b>의 힘으로 건너라.'
 ],
 good:[['고마워','괜찮아?','멈춰!','존중해','함께해'],['비밀번호','지켜 줘','신고하기','안전','확인하기'],['좋아해','자유','내 취향','울어도 돼','다 같이'],['도와주세요','용기','말해도 돼','함께 가자','괜찮아'],['존중','보호','자유','용기','연대']],
 bad:[['놀림','조롱','비웃음'],['유포','캐묻기','낚시'],['편견','고정관념','틀'],['협박','침묵','두려움'],['차별','혐오','불평등']],
 len:[2300,2700,3000,3300,3800],
 speed:[80,86,90,94,100],
 drift:[1.2,1.35,1.5,1.6,1.65],
 kinds:[['gap','roller','crow'],['gap','roller','crow','swing','slip','rock'],['gap','roller','swing','gust','reverse','bounce','rock'],['gap','roller','crow','swing','gust','slip','reverse','narrow','rock'],['gap','roller','crow','swing','gust','slip','reverse','bounce','narrow','rock']],
 chaser:[0,0,62,70,80]
};
const AIR=0.62,PY=232,PX=240;
let TR=null;
const pick=a=>a[(Math.random()*a.length)|0];
const rnd=(a,b)=>a+Math.random()*(b-a);
function trialAssist(){const f=S.trialFails||0,dm=teacherTrialMul();return {drift:Math.max(.4,(1-.18*f)*dm.drift),speed:Math.max(.75,(1-.06*f)*dm.speed),hearts:3+Math.min(2,f)+dm.hearts}}
function buildCourse(st,as){
 const L=TRIAL.len[st],ev=[],spd=TRIAL.speed[st]*as.speed;
 const maxGap=Math.min(30+st*4,spd*AIR*.6);
 const kinds=TRIAL.kinds[st];
 let d=360,i=0;
 while(d<L-300){
  const k=i<kinds.length?kinds[i]:pick(kinds);i++;
  if(k==='gap'){const len=rnd(maxGap*.75,maxGap);ev.push({type:'gap',d,len});d+=len}
  else if(k==='roller'){const v=38+st*7;ev.push({type:'roller',d,v,word:pick(TRIAL.bad[st]),r:0});if(st>=4&&Math.random()<.45)ev.push({type:'roller',d:d+46,v,word:pick(TRIAL.bad[st]),r:0})}
  else if(k==='swing'){ev.push({type:'swing',d,amp:rnd(95,128),w:rnd(1.8,2.3)+st*.12,ph:rnd(0,6.28),x:PX})}
  else if(k==='gust'){const len=rnd(170,230);ev.push({type:'gust',d,len,dir:Math.random()<.5?-1:1,pow:Math.min(3.3,2.4+st*.3)});d+=len*(st>=3?.45:1)}
  else if(k==='crow'){ev.push({type:'crow',d,side:Math.random()<.5?-1:1,x:null,word:pick(TRIAL.bad[st])})}
  else if(k==='rock'){ev.push({type:'rock',d,trig:null})}
  else{const len=rnd(170,230);ev.push({type:k,d,len});d+=len*(st>=3?.5:.85)}
  const sp=rnd(150,205)-st*8;
  if(Math.random()<.7)ev.push({type:'orb',d:d+sp/2,word:pick(TRIAL.good[st])});
  d+=sp;
 }
 const fog=st>=3?[{d0:L*.28,d1:L*(st===3?.78:.55)}]:[];
 if(st===4)fog.push({d0:L*.72,d1:L*.9});
 return {L,ev,fog};
}
function initTrial(){
 const as=trialAssist(),st=S.stage;
 const t={stage:st,as,phase:'intro',time:0,count:3,hearts:as.hearts,maxHearts:as.hearts,orbs:0,got:[],lost:0,
  speed:TRIAL.speed[st]*as.speed,drift:TRIAL.drift[st]*as.drift,p1:rnd(0,6),p2:rnd(0,6),p3:rnd(0,6),
  P:{d:0,lean:0,lv:0,air:0,inv:0,falling:0,fallDir:1},menu:null,msg:null,touch:0,shown:false,done:false,panelAt:0};
 t.c=buildCourse(st,as);t.gusts=t.c.ev.filter(e=>e.type==='gust');t.zones=t.c.ev.filter(e=>['slip','reverse','bounce','narrow'].includes(e.type));t.chase=TRIAL.chaser[st]*as.speed;t.chD=-240;t.bt=0;t.bs=1;
 return t;
}
function startTrial(practice){
 if(mode!=='field'||trans||B||TR)return;
 TR=initTrial();TR.practice=!!practice;mode='trial';keys={};path=[];
 Music.sfx('encounter');
 trans={t0:performance.now(),dur:600,kind:'swirl',mid:()=>{if(!TR)return;TR.shown=true;$('#questbox').hidden=true;Music.play('trial');trialIntroPanel()}};
}
// ----- 패널(메뉴) -----
function trialPanel(html,buttons){
 if(!TR)return;
 const el=$('#tpanel');
 el.innerHTML=html+buttons.map((b,i)=>`<button class="choice" data-i="${i}"><kbd>${i+1}</kbd>${b[0]}</button>`).join('');
 $('#trialui').hidden=false;
 TR.menu={sel:0,fns:buttons.map(b=>b[1])};
 el.querySelectorAll('.choice').forEach((btn,i)=>{btn.onclick=()=>trialChoose(i);btn.onmouseenter=()=>{if(TR&&TR.menu){TR.menu.sel=i;trialMark()}}});
 trialMark();
}
function trialChoose(i){
 if(!TR||!TR.menu)return;const fn=TR.menu.fns[i];if(!fn)return;
 TR.menu=null;$('#trialui').hidden=true;Music.sfx('select');fn();
}
function trialMark(){if(!TR||!TR.menu)return;$('#tpanel').querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('sel',i===TR.menu.sel))}
function trialKey(k){
 if(!TR)return;
 if(k==='m'||k==='M'){toggleSound();return}
 if(TR.menu){const n=TR.menu.fns.length;
  if(k==='ArrowDown'||k==='s'||k==='S'||k==='ArrowRight'||k==='d'||k==='D'){TR.menu.sel=(TR.menu.sel+1)%n;trialMark();Music.sfx('select')}
  else if(k==='ArrowUp'||k==='w'||k==='W'||k==='ArrowLeft'||k==='a'||k==='A'){TR.menu.sel=(TR.menu.sel-1+n)%n;trialMark();Music.sfx('select')}
  else if(k===' '||k==='Enter')trialChoose(TR.menu.sel);
  else if(/^[1-9]$/.test(k)&&+k<=n)trialChoose(+k-1);
  return;
 }
 if(TR.phase==='run'){if(k===' '||k==='Enter'||k==='z'||k==='Z')trialJump();else if(k==='Escape'||k==='p'||k==='P')trialPause()}
}
function trialIntroPanel(){
 const st=TR.stage;
 trialPanel(`<h3>외줄 수련 · ${TRIAL.names[st]}</h3><p>${TRIAL.desc[st]}</p>
  <p class="keys">← → 균형 잡기 (기울어진 <b>반대쪽</b>을 누르기!)<br>Space 점프 · ↑ 빠르게 · ↓ 천천히+웅크리기 · Esc 일시정지</p>
  <p class="muted">터치: 화면 왼쪽·오른쪽을 누르고 있기 · 가운데 또는 A 버튼 점프<br>목숨 ${'♥'.repeat(TR.hearts)}${S.trialFails?` · 도사님 도움: 바람이 약해지고 목숨이 늘었다 (${S.trialFails}번째 재도전)`:''}</p>`,
  [['수련 시작!',()=>{TR.phase='count';TR.count=3}],['나중에 하기',()=>exitTrial(false)]]);
}
function trialPause(){
 if(!TR||TR.phase!=='run')return;
 TR.phase='pause';keys={};TR.touch=0;
 trialPanel('<h3>일시정지</h3><p>숨을 고르자… 준비되면 다시 출발!</p>',[['계속하기',()=>{TR.phase='count';TR.count=1.5}],['포기하고 나가기',()=>{S.trialFails=(S.trialFails||0)+1;save();exitTrial(false)}]]);
}
function trialJump(){const P=TR.P;if(TR.phase==='run'&&P.air<=0&&P.falling<=0){P.air=AIR;Music.sfx('jump')}}
function trialMsg(text,color='#fff'){TR.msg={text,color,t:TR.time}}
// ----- 진행 -----
function trialUpdate(dt){
 const T=TR;T.time+=dt;
 if(!T.shown)return;
 if((T.phase==='intro'||T.phase==='pause')&&!T.menu){T.phase==='intro'?trialIntroPanel():(T.phase='run',trialPause());return}
 if(T.phase==='count'){T.count-=dt;if(T.count<=0){T.phase='run';Music.sfx('ok');trialMsg('출발!','#ffd75e')}return}
 if(T.phase==='clear'||T.phase==='fail'){if(!T.menu&&T.time>=T.panelAt){T.phase==='clear'?clearPanel():failPanel()}return}
 if(T.phase!=='run')return;
 const P=T.P;
 if(P.falling>0){P.falling-=dt;if(P.falling<=0)afterFall();return}
 const up=keys.ArrowUp||keys.w||keys.W,dn=keys.ArrowDown||keys.s||keys.S;
 // 공중에서는 감속하지 않음(느리게 누른 채 점프해도 틈을 넘을 수 있게)
 const v=T.speed*(up?1.45:(dn&&P.air<=0)?.5:1);
 P.d+=v*dt;
 const Lk=keys.ArrowLeft||keys.a||keys.A?1:0,Rk=keys.ArrowRight||keys.d||keys.D?1:0;
 const inZ=type=>T.zones.some(e=>e.type===type&&P.d>=e.d&&P.d<=e.d+e.len);
 const slip=inZ('slip'),rev=inZ('reverse'),bounce=inZ('bounce'),narrow=inZ('narrow');
 let input=Math.max(-1,Math.min(1,(Rk-Lk)+T.touch));if(rev)input=-input;
 P.crouch=!!dn&&P.air<=0;
 const tt=T.time;
 const drift=T.drift*(slip?1.4:1)*(Math.sin(tt*1.3+T.p1)*.6+Math.sin(tt*2.7+T.p2)*.35+Math.sin(tt*.5+T.p3)*.55);
 let gust=0;for(const g of T.gusts)if(P.d>=g.d&&P.d<=g.d+g.len)gust+=g.dir*g.pow*T.as.drift;
 if(bounce){T.bt+=dt;if(T.bt>.6){T.bt=0;T.bs=-T.bs;P.lv+=T.bs*1.8*T.as.drift}}
 const acc=drift+gust+input*4.4*(slip?.45:1)+P.lean*(narrow?2.2:1.25)-P.lv*2.4;
 if(T.chase){T.chD+=T.chase*dt;if(T.chD>P.d-8&&P.inv<=0){T.chD=P.d-210;fall('chaser');return}}
 P.lv+=acc*dt;P.lean+=P.lv*dt*(P.air>0?.6:1);
 if(P.air>0)P.air=Math.max(0,P.air-dt);
 if(P.inv>0)P.inv-=dt;
 if(Math.abs(P.lean)>=1){fall('balance');return}
 for(const e of T.c.ev){
  if(e.type==='gap'){if(P.air<=0&&P.d>e.d+3&&P.d<e.d+e.len-3){fall('gap');return}}
  else if(e.type==='roller'&&!e.gone){
   if(e.d-P.d<280){e.d-=e.v*dt;e.r+=e.v*dt/9}
   if(e.d<P.d-60)e.gone=true;
   else if(P.air<=0&&P.inv<=0&&Math.abs(e.d-P.d)<12){e.gone=true;fall('roller',e.word);return}
  }
  else if(e.type==='swing'){
   e.x=PX+Math.sin(tt*e.w+e.ph)*e.amp;
   if(!e.hit&&P.inv<=0&&Math.abs(e.d-P.d)<11&&Math.abs(e.x-(PX+P.lean*7))<16){e.hit=true;const dir=Math.cos(tt*e.w+e.ph)>=0?1:-1;P.lv+=dir*2.6;Music.sfx('hurt');shake=4;trialMsg('퍽! 도깨비불에 휘청!','#ff9a6b')}
  }
  else if(e.type==='crow'&&!e.done){
   const dd=e.d-P.d;
   if(e.x==null&&dd<T.speed*.75&&dd>-20){e.x=PX+e.side*190;Music.sfx('charge')}
   if(e.x!=null){e.x-=e.side*260*dt;if(Math.sign(e.x-PX)===-e.side&&Math.abs(e.x-PX)>210)e.done=true;
    if(!e.hit&&P.inv<=0&&!P.crouch&&Math.abs(e.d-P.d)<12&&Math.abs(e.x-(PX+P.lean*7))<18){e.hit=true;fall('crow',e.word);return}}
  }
  else if(e.type==='rock'&&!e.done){
   const dd=e.d-P.d;
   if(e.trig==null&&dd<T.speed*1.1&&dd>0){e.trig=tt;Music.sfx('charge')}
   if(e.trig!=null&&tt-e.trig>=1.1){e.done=true;e.landT=tt;shake=3;Music.sfx('push');if(P.inv<=0&&Math.abs(e.d-P.d)<14){fall('rock');return}}
  }
  else if(e.type==='orb'&&!e.got&&Math.abs(e.d-P.d)<14){e.got=true;T.orbs++;T.got.push(e.word);Music.sfx('chime');floaters.push({x:PX+22,y:PY-30,text:'+'+e.word,color:'#ffd75e',t0:performance.now()})}
 }
 if(P.d>=T.c.L){T.phase='clear';T.panelAt=T.time+1.1;trialClear()}
}
function fall(reason,word){
 const T=TR,P=T.P;P.falling=.9;P.fallDir=Math.sign(P.lean)||1;if(!teacherGod())T.hearts--;T.lost++;Music.sfx('splash');shake=6;
 trialMsg(reason==='balance'?'균형을 잃었다!':reason==='gap'?'끊어진 곳에 빠졌다!':reason==='crow'?`「${word}」 까마귀에 채였다! (↓ 웅크리기)`:reason==='rock'?'낙석에 맞았다! (그림자를 보면 속도 조절)':reason==='chaser'?'먹구름에 붙잡혔다! (멈추지 마!)':`「${word}」에 부딪혔다!`,'#ff6b5b');
}
function afterFall(){
 const T=TR,P=T.P;
 if(T.hearts<=0){T.phase='fail';T.panelAt=T.time+.4;if(!T.practice)S.trialFails=(S.trialFails||0)+1;save();Music.sfx('wrong');return}
 P.d=Math.max(0,P.d-50);
 for(let k=0;k<3;k++)for(const e of T.c.ev)if(e.type==='gap'&&P.d>e.d-24&&P.d<e.d+e.len+4)P.d=Math.max(0,e.d-30);
 for(const e of T.c.ev){if(e.type==='roller'&&!e.gone&&e.d>P.d-20&&e.d<P.d+170)e.d=P.d+300;if((e.type==='crow'||e.type==='rock')&&!e.done&&e.d>P.d-20&&e.d<P.d+120){e.x=null;e.trig=null;e.hit=false}}
 if(T.chase)T.chD=Math.min(T.chD,P.d-220);
 P.lean=0;P.lv=0;P.air=0;P.inv=1.8;
 trialMsg('다시 일어섰다! ♥'+T.hearts,'#7be38a');
}
function trialClear(){
 const T=TR,perfect=T.lost===0,xp=100+T.orbs*10,before=level();
 if(T.practice){T.reward={xp:0,perfect,up:false};Music.play('victory',null);trialMsg('연습 완주!','#ffd75e');return}
 S.trial=true;S.xp+=xp;if(perfect)S.items.potion++;
 S.trialRec=Array.isArray(S.trialRec)?S.trialRec:[];
 S.trialRec[T.stage]={orbs:T.orbs,lost:T.lost,tries:(S.trialFails||0)+1};
 S.trialFails=0;T.reward={xp,perfect,up:level()>before};if(T.reward.up)healAll();
 save();hud();Music.play('victory',null);trialMsg('수련 완주!','#ffd75e');
}
function clearPanel(){
 const T=TR,r=T.reward;
 trialPanel(`<h3>${T.practice?'연습 완주':'수련 성공!'} · ${TRIAL.names[T.stage]}</h3><p>${T.practice?'교사용 연습이라 진행 상황은 바뀌지 않아요.':'결계가 완전히 풀렸다. 이제 보스에게 도전할 수 있다!'}</p>
  <p>모은 구슬 ${T.orbs}개 · 경험치 +${r.xp}${r.perfect?' · <b>한 번도 안 떨어짐! 회복약 +1</b>':` · 떨어진 횟수 ${T.lost}`}${r.up?` · 레벨 업! Lv.${level()}`:''}</p>
  ${T.got.length?`<p class="keys">모은 말: ${T.got.join(' · ')}</p>`:''}`,[[T.practice?'연습 끝내기':'보스에게 가자!',()=>exitTrial(!T.practice)]]);
}
function failPanel(){
 const f=S.trialFails||0;
 const btns=[['다시 도전',()=>retryTrial()],['잠시 쉬기 (필드로)',()=>exitTrial(false)]];
 if(f>=2&&!TR.practice)btns.push(['도사님 도움으로 통과하기',()=>{S.trial=true;S.trialRec=Array.isArray(S.trialRec)?S.trialRec:[];S.trialRec[TR.stage]={orbs:0,lost:TR.lost,tries:f,helped:true};S.trialFails=0;save();exitTrial(true)}]);
 trialPanel(`<h3>수련 실패…</h3><p>${pick(['괜찮아, 넘어져도 다시 일어나면 돼!','허허, 균형은 연습할수록 좋아지는 법이지!','혼자 힘들면 도움을 청해도 된단다.'])}</p><p class="muted">다시 도전할수록 바람이 약해지고 목숨이 늘어납니다.${f>=2?' 너무 어렵다면 도사님의 도움을 받아 통과할 수도 있어요.':''}</p>`,btns);
}
function retryTrial(){TR=initTrial();TR.shown=true;TR.phase='count';TR.count=2.5;keys={};Music.play('trial')}
function exitTrial(cleared){
 if(!TR)return;TR.phase='exit';
 trans={t0:performance.now(),dur:600,kind:'fade',mid:()=>{
  TR=null;$('#trialui').hidden=true;$('#questbox').hidden=false;mode='field';keys={};cooldown=performance.now()+800;
  Music.play('field');hud();cv.focus();
  if(cleared){log(`외줄 수련 통과! ${ENEMY_NAMES[S.stage].boss}의 결계가 풀렸다.`,'gold');say([['sys',`결계가 완전히 풀렸다! 이제 ${ENEMY_NAMES[S.stage].boss}에게 도전하자.`]])}
  else log('외줄 수련터에서 물러났다. 준비되면 다시 도전하자.');
 }};
}
// ----- 그리기 -----
function ttxt(s,x,y,size,color,align='center'){ctx.font=size+'px NeoDunggeunmo, monospace';ctx.textAlign=align;ctx.lineWidth=3;ctx.strokeStyle='#1a0a05';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y)}
function heart(x,y,full){const c=full?'#ff4a5a':'#4a2a35';ctx.fillStyle='#1a0a05';ctx.fillRect(x-1,y,11,7);ctx.fillRect(x,y-1,4,2);ctx.fillRect(x+5,y-1,4,2);ctx.fillRect(x+1,y+7,7,2);ctx.fillRect(x+3,y+9,3,1);
 ctx.fillStyle=c;ctx.fillRect(x,y,9,6);ctx.fillRect(x+1,y-0,3,1);ctx.fillRect(x+5,y,3,1);ctx.fillRect(x+1,y+6,7,1);ctx.fillRect(x+2,y+7,5,1);ctx.fillRect(x+3,y+8,3,1);if(full){ctx.fillStyle='#ffb0b8';ctx.fillRect(x+1,y+1,2,2)}}
function drawAbyss(st,dd,t){
 const par=dd*.5;
 const base=['#2f78c8','#123d22','#7aa84a','#2a2238','#2a1a4a'][st];
 ctx.fillStyle=base;ctx.fillRect(0,0,480,320);
 const n0=Math.floor((par-(320-PY))/40)-1;
 for(let n=n0;n<n0+11;n++){
  const y=PY-(n*40-par);
  for(let j=0;j<5;j++){
   const h=hash(n,j,st+90),x=64+h*352;
   if(st===0){ctx.fillStyle='#5aa0e8';ctx.fillRect(x,y,18,2);ctx.fillRect(x+6,y+2,10,1);if(j===0){ctx.fillStyle='#6a7a8a';ctx.fillRect(x+40,y+12,10,6)}}
   else if(st===1){ctx.fillStyle=j%2?'#1d5a34':'#2e7a44';ctx.beginPath();ctx.arc(x,y,10+h*8,0,7);ctx.fill()}
   else if(st===2){ctx.fillStyle=['#ff7aa8','#ffe06a','#ffffff'][j%3];ctx.fillRect(x,y,3,3);ctx.fillRect(x+20,y+18,2,2);ctx.fillStyle='#6a983a';ctx.fillRect(x+9,y+9,8,2)}
   else if(st===3){ctx.fillStyle='rgba(255,255,255,.10)';const cx=(x+t/40*(j%2?1:-1))%420+30;ctx.fillRect(cx,y,40,6);ctx.fillRect(cx+8,y-4,22,4)}
   else{const f=.5+Math.sin(t/200+n+j)*.5;ctx.fillStyle=`rgba(255,215,94,${.25+f*.5})`;ctx.fillRect(x,y,3,3);ctx.fillStyle='rgba(154,138,224,.25)';ctx.fillRect(x-20,y+14,30,2)}
  }
 }
 // 깊이감 그라데이션
 const g=ctx.createLinearGradient(64,0,240,0);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(64,0,176,320);
 const g2=ctx.createLinearGradient(416,0,240,0);g2.addColorStop(0,'rgba(0,0,0,.35)');g2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g2;ctx.fillRect(240,0,176,320);
}
function drawBanks(st,dd){
 const th=THEMES[st];
 for(const side of [0,1]){
  const x0=side?416:0;
  ctx.fillStyle=th.grass[0];ctx.fillRect(x0,0,64,320);
  const n0=Math.floor((dd-(320-PY))/16)-1;
  for(let n=n0;n<n0+22;n++){
   const y=PY-(n*16-dd);const h=hash(n,side,st+50);
   const edge=side?416-((h*6)|0):64+((h*6)|0)-6;
   ctx.fillStyle='#2a1a10';ctx.fillRect(side?edge-4:edge,y,6,16);
   ctx.fillStyle=th.grass[1];ctx.fillRect(x0+((h*40)|0),y+4,3,3);
   if(n%3===0){for(let j=0;j<2;j++){if(hash(n,j+side*2,st+60)<.65)drawTree(ctx,(side?424:6)+j*24,y-8,th,st,n,j)}}
  }
 }
}
function drawTrial(t){
 const T=TR,st=T.stage,P=T.P,L=T.c.L;
 const sy=d=>PY-(d-P.d);
 drawAbyss(st,P.d,t);
 // 돌풍 구역
 for(const g of T.gusts){const y0=sy(g.d+g.len),y1=sy(g.d);if(y1<-10||y0>330)continue;
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(64,y0,352,y1-y0);
  for(let i=0;i<16;i++){const yy=y0+((i*53)%Math.max(1,(y1-y0)|0));const xx=64+(((t*.22*g.dir+i*67)%352)+352)%352;ctx.fillStyle=st===2?['#ff9ec4','#ffffff'][i%2]:'rgba(255,255,255,.7)';ctx.fillRect(xx,yy,st===2?3:10,st===2?3:1)}
  const ay=Math.max(y0+10,Math.min(y1-10,PY-60));ttxt(g.dir>0?'▶▶ 돌풍':'돌풍 ◀◀',g.dir>0?110:370,ay,12,'#ffe06a')}
 drawBanks(st,P.d);
 // 장대
 const gaps=T.c.ev.filter(e=>e.type==='gap');
 const pole=(d0,d1)=>{const ya=sy(d1),yb=sy(d0);if(yb<-4||ya>324)return;ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(PX+8,ya,6,yb-ya);ctx.fillStyle='#5a3a1a';ctx.fillRect(PX-7,ya,14,yb-ya);ctx.fillStyle='#9a6a32';ctx.fillRect(PX-6,ya,12,yb-ya);ctx.fillStyle='#c08a48';ctx.fillRect(PX-5,ya,3,yb-ya);
  const b0=Math.ceil(d0/48)*48;for(let b=b0;b<d1;b+=48){const y=sy(b);ctx.fillStyle='#e8d8a8';ctx.fillRect(PX-8,y,16,2);ctx.fillStyle='#8a7a5a';ctx.fillRect(PX-8,y+2,16,1)}};
 let cur=-120;for(const g of gaps){pole(cur,g.d);const ya=sy(g.d),yb=sy(g.d+g.len);ctx.fillStyle='#c08a48';ctx.fillRect(PX-6,ya-3,4,3);ctx.fillRect(PX+2,ya-2,3,2);ctx.fillRect(PX-4,yb,3,3);ctx.fillRect(PX+3,yb,3,2);cur=g.d+g.len}
 pole(cur,L+140);
 // 출발·도착 발판
 const deck=(d0,d1)=>{const ya=sy(d1),yb=sy(d0);if(yb<0||ya>320)return;ctx.fillStyle='#4a2a12';ctx.fillRect(PX-44,ya,88,yb-ya);ctx.fillStyle='#a8743a';for(let y=ya+1;y<yb;y+=6)ctx.fillRect(PX-43,y,86,4)};
 deck(-120,-6);deck(L+6,L+140);
 const fy=sy(L+70);if(fy>-40&&fy<360){ctx.fillStyle='#1a0a0a';ctx.fillRect(PX-30,fy-28,4,40);ctx.fillRect(PX+26,fy-28,4,40);ctx.fillStyle='#c8302a';ctx.fillRect(PX-29,fy-27,2,38);ctx.fillRect(PX+27,fy-27,2,38);ctx.fillStyle='#1a1a2a';ctx.fillRect(PX-36,fy-34,72,6);ctx.fillStyle='#ffd75e';ctx.fillRect(PX-14,fy-30,28,6);ttxt('완주',PX,fy-38,12,'#ffd75e')}
 // 출발점 응원단
 const cy=sy(-60);if(cy<360){const fans=[['master',PX-30]];if(S.stage>=1)fans.push(['bomi',PX+30]);if(S.stage>=2)fans.push(['gomdol',PX+56]);fans.forEach(([k,x],i)=>Sprites.draw(ctx,k,'front',x,cy+((t/200+i)|0)%2*-2,1.5,{}));if(cy>40&&cy<330)ttxt('힘내라!',PX,cy-34,12,'#fff')}
 // 구간 효과
 for(const z of T.zones){const y0=sy(z.d+z.len),y1=sy(z.d);if(y1<-10||y0>330)continue;const ly=Math.max(y0+12,Math.min(y1-6,PY-70));
  if(z.type==='slip'){ctx.fillStyle='rgba(150,220,255,.55)';ctx.fillRect(PX-7,y0,14,y1-y0);for(let yy=y0+6;yy<y1;yy+=18){ctx.fillStyle='#fff';ctx.fillRect(PX-3+((yy/18|0)%2)*4,yy,2,2)}ttxt('미끌!',PX+30,ly,11,'#bfefff')}
  else if(z.type==='narrow'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(PX-7,y0,4,y1-y0);ctx.fillRect(PX+3,y0,4,y1-y0);ttxt('좁은 장대!',PX+38,ly,11,'#ffe9a8')}
  else if(z.type==='bounce'){ctx.fillStyle='rgba(255,230,150,.7)';for(let yy=y0;yy<y1;yy+=9)ctx.fillRect(PX-11+Math.sin(t/70+yy*.3)*3,yy,22,1);ttxt('출렁!',PX+30,ly,11,'#ffe9a8')}
  else if(z.type==='reverse'){ctx.fillStyle='rgba(170,90,255,.2)';ctx.fillRect(64,y0,352,y1-y0);for(let i=0;i<6;i++){const yy=y0+((i*47+t/20)%Math.max(1,y1-y0));ctx.fillStyle='rgba(220,180,255,.6)';ctx.fillRect(90+i*55,yy,10,2)}ttxt('⇄ 좌우 반대!',PX,Math.max(y0+14,Math.min(y1-8,PY-90)),13,'#e0c8ff')}
 }
 // 장애물·구슬
 for(const e of T.c.ev){
  const y=sy(e.d);if(y<-30||y>350)continue;
  if(e.type==='orb'&&!e.got){const p=Math.sin(t/150+e.d)*1.5;ctx.fillStyle='rgba(255,215,94,.35)';ctx.beginPath();ctx.arc(PX,y-4,9+p,0,7);ctx.fill();ctx.fillStyle='#ffd75e';ctx.beginPath();ctx.arc(PX,y-4,5,0,7);ctx.fill();ctx.fillStyle='#fff8d0';ctx.fillRect(PX-2,y-7,2,2);ttxt(e.word,PX+16,y-1,11,'#fff3b0','left')}
  else if(e.type==='roller'&&!e.gone){ctx.save();ctx.translate(PX,y-6);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-9,6,18,3);ctx.fillStyle='#3a1a0a';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.fillStyle='#9a4a2a';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.rotate(e.r);ctx.fillStyle='#e8c070';ctx.fillRect(-9,-1,18,2);ctx.fillRect(-1,-9,2,18);ctx.restore();ttxt(e.word,PX,y-20,11,'#ff9a8a');
   if(e.d-P.d<280&&e.d-P.d>40&&((t/120)|0)%2)ttxt('!',PX+18,y-8,16,'#ff4a3a')}
  else if(e.type==='crow'&&!e.done){
   if(e.x!=null){const x=e.x,yy=y-16,f=((t/70)|0)%2;ctx.fillStyle='#1a1a22';ctx.beginPath();ctx.ellipse(x,yy,8,5,0,0,7);ctx.fill();ctx.fillRect(x-14,yy-(f?6:-2),10,3);ctx.fillRect(x+4,yy-(f?6:-2),10,3);ctx.fillStyle='#ffd75e';ctx.fillRect(x+(e.side<0?6:-9),yy-1,3,2);ctx.fillStyle='#ff4a4a';ctx.fillRect(x+(e.side<0?3:-5),yy-3,2,2);ttxt(e.word,x,yy-12,10,'#ff9a8a');
    if(!P.crouch&&e.d-P.d<T.speed*.9&&e.d-P.d>-10)ttxt('↓ 웅크려!',PX,PY-66,15,'#ff6b5b')}
   else if(e.d-P.d<300&&e.d-P.d>0)ttxt(e.side>0?'까마귀 ◀':'▶ 까마귀',e.side>0?380:100,y-14,11,'#ff9a8a')}
  else if(e.type==='rock'){
   if(e.trig!=null&&!e.done){const k=Math.min(1,(T.time-e.trig)/1.1);ctx.fillStyle=`rgba(0,0,0,${.25+k*.35})`;ctx.beginPath();ctx.ellipse(PX,y-2,5+k*11,2+k*4,0,0,7);ctx.fill();const ry=y-6-(1-k)*150;ctx.fillStyle='#3a3a3a';ctx.beginPath();ctx.arc(PX,ry,9,0,7);ctx.fill();ctx.fillStyle='#8a8a8a';ctx.beginPath();ctx.arc(PX-2,ry-2,6,0,7);ctx.fill();if(((t/120)|0)%2)ttxt('낙석!',PX+34,y-8,12,'#ff6b5b')}
   else if(e.done&&T.time-e.landT<.6){const k=(T.time-e.landT)/.6;ctx.fillStyle=`rgba(140,140,140,${1-k})`;for(let j=0;j<6;j++)ctx.fillRect(PX+Math.cos(j)*k*30,y-4-Math.sin(j*2)*k*12,3,3)}}
  else if(e.type==='swing'){ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(PX-e.amp,y-6);ctx.lineTo(PX+e.amp,y-6);ctx.stroke();ctx.setLineDash([]);
   const x=e.x;ctx.fillStyle='rgba(176,106,255,.35)';ctx.beginPath();ctx.arc(x,y-6,11,0,7);ctx.fill();ctx.fillStyle='#b06aff';ctx.beginPath();ctx.arc(x,y-6,7,0,7);ctx.fill();ctx.fillRect(x-3,y-17,6,6);ctx.fillStyle='#f0d0ff';ctx.fillRect(x-4,y-8,3,3);ctx.fillRect(x+1,y-8,3,3);ctx.fillStyle='#1a0a2a';ctx.fillRect(x-3,y-7,1,2);ctx.fillRect(x+2,y-7,1,2)}
 }
 // 주인공
 const blink=P.inv>0&&((t/80)|0)%2===0;
 const lift=P.air>0?Math.sin((1-P.air/AIR)*Math.PI)*14:0;
 const px=PX+P.lean*7;
 if(P.falling>0){
  const k=1-P.falling/.9;ctx.save();ctx.globalAlpha=1-k*.6;ctx.translate(px+P.fallDir*k*34,PY+k*10);ctx.rotate(P.fallDir*k*3);ctx.scale(1-k*.7,1-k*.7);Sprites.draw(ctx,'baram','back',0,0,2,{});ctx.restore();
  if(k>.55){const r=(k-.55)*60;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(px+P.fallDir*34,PY+12,r,r*.4,0,0,7);ctx.stroke()}
 } else if(!blink){
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(px,PY,10-lift/3,3,0,0,7);ctx.fill();
  ctx.save();ctx.translate(px,PY-lift);ctx.rotate(P.lean*.5);
  const bob=T.phase==='run'&&P.air<=0?((t/140)|0)%2:0;
  if(P.crouch)ctx.scale(1.12,.68);
  Sprites.draw(ctx,'baram','back',0,-bob,2,{});
  ctx.rotate(P.lean*.3);ctx.fillStyle='#3a2410';ctx.fillRect(-36,-20,72,4);ctx.fillStyle='#b07a3a';ctx.fillRect(-35,-19,70,2);ctx.fillStyle='#d8382a';ctx.fillRect(-40,-23,6,8);ctx.fillRect(34,-23,6,8);ctx.fillStyle='#ffd75e';ctx.fillRect(-39,-16,4,3);ctx.fillRect(35,-16,4,3);
  ctx.restore();
 }
 // 안개
 let fog=0;for(const z of T.c.fog){if(P.d>z.d0-80&&P.d<z.d1+80)fog=Math.max(fog,Math.min(1,(P.d-(z.d0-80))/80,(z.d1+80-P.d)/80))}
 if(fog>0){const g=ctx.createRadialGradient(px,PY-10,36,px,PY-10,130);g.addColorStop(0,'rgba(34,28,52,0)');g.addColorStop(1,`rgba(34,28,52,${.96*fog})`);ctx.fillStyle=g;ctx.fillRect(0,0,480,320);if(fog>.5)ttxt('침묵의 안개…',PX,40,12,'rgba(220,210,255,.8)')}
 // 안개 속에서도 굴러오는 통은 경고 표시(공정하게)
 if(fog>.2)for(const e of T.c.ev){if(e.type!=='roller'||e.gone)continue;const dd=e.d-P.d;if(dd>10&&dd<280){const y=Math.max(PY-140,sy(e.d));ttxt('▼ 「'+e.word+'」 굴러온다!',PX,y-14,12,'#ff6b5b')}}
 // 쫓아오는 먹구름
 if(T.chase){const cy=sy(T.chD);if(cy<380){ctx.fillStyle='rgba(28,18,40,.88)';for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(60+i*40,cy+Math.sin(t/200+i)*4,28,0,7);ctx.fill()}ctx.fillRect(30,cy,420,Math.max(0,360-cy));ctx.fillStyle='#ff4a5a';ctx.fillRect(214,cy-6,6,4);ctx.fillRect(258,cy-6,6,4)}
  if(T.chD>P.d-110&&T.phase==='run')ttxt('먹구름이 쫓아온다! ↑로 달려!',PX,160,13,'#ff9a8a')}
 // HUD
 ctx.fillStyle='rgba(16,26,90,.85)';ctx.fillRect(6,6,168,36);ctx.strokeStyle='#f4ecd8';ctx.lineWidth=2;ctx.strokeRect(6,6,168,36);
 ttxt('외줄 수련 · '+TRIAL.names[st],12,20,11,'#ffd75e','left');
 for(let i=0;i<T.maxHearts;i++)heart(14+i*14,27,i<T.hearts);
 ttxt('구슬 '+T.orbs,410,22,13,'#ffd75e','left');
 // 진행 막대
 const pr=Math.max(0,Math.min(1,P.d/L));ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(464,50,8,200);ctx.fillStyle='#7be38a';ctx.fillRect(464,50+200*(1-pr),8,200*pr);ctx.strokeStyle='#f4ecd8';ctx.lineWidth=1;ctx.strokeRect(464,50,8,200);ttxt('도착',468,46,10,'#fff');
 // 균형 계기판
 const mx=140,mw=200,my=296;
 ctx.fillStyle='rgba(16,26,90,.9)';ctx.fillRect(mx-8,my-14,mw+16,24);ctx.strokeStyle='#f4ecd8';ctx.strokeRect(mx-8,my-14,mw+16,24);
 ctx.fillStyle='#c83a2a';ctx.fillRect(mx,my-4,mw,8);ctx.fillStyle='#e8b030';ctx.fillRect(mx+mw*.12,my-4,mw*.76,8);ctx.fillStyle='#3fae5a';ctx.fillRect(mx+mw*.3,my-4,mw*.4,8);
 const nx=mx+mw/2+Math.max(-1,Math.min(1,P.lean))*mw/2;ctx.fillStyle='#fff';ctx.fillRect(nx-1,my-9,3,18);ctx.fillStyle='#1a0a05';ctx.fillRect(nx-2,my-10,5,2);
 ttxt('균형',mx-14,my+4,11,'#fff','right');
 if(T.phase==='run'&&Math.abs(P.lean)>.5&&P.falling<=0&&((t/150)|0)%2)ttxt(P.lean>0?'◀ 왼쪽!':'오른쪽! ▶',P.lean>0?mx-40:mx+mw+40,my-22,16,'#ff6b5b');
 // 카운트다운·메시지
 if(T.phase==='count')ttxt(String(Math.ceil(T.count)),PX,150,48,'#ffd75e');
 if(T.msg&&T.time-T.msg.t<1.3)ttxt(T.msg.text,PX,120,18,T.msg.color);
}
// 필드의 깃발 수련터
function drawTrialPost(X,Y,t){
 const open=S.talked&&S.shrine&&!S.trial;
 if(open){ctx.fillStyle=`rgba(255,215,94,${.25+Math.sin(t/160)*.15})`;ctx.beginPath();ctx.arc(X,Y-10,14,0,7);ctx.fill()}
 ctx.fillStyle='#2a1a0a';ctx.fillRect(X-8,Y-24,3,24);ctx.fillRect(X+5,Y-24,3,24);
 ctx.fillStyle='#9a6a32';ctx.fillRect(X-7,Y-23,1,23);ctx.fillRect(X+6,Y-23,1,23);
 ctx.fillStyle='#e8d8a8';ctx.fillRect(X-6,Y-14,12,1);
 const wave=((t/180)|0)%2;
 ctx.fillStyle=S.trial?'#3fae5a':'#d8382a';ctx.fillRect(X-5,Y-23,10,8+wave);
 ctx.fillStyle='#fff6c0';ctx.fillRect(X-3,Y-20,6,1);ctx.fillRect(X-1,Y-21,2,4);
 ctx.fillStyle='#5a4a3a';ctx.fillRect(X-9,Y-2,18,2);
}

<script>// 전투 — 여러 적 · 동료 교대 차례 · 공격/필살기(문제)/기술/도구/방어/도망 · 미니게임(동체시력 게임·타이밍 막기·주문·힘겨루기)
let B=null;
const ABORT={abort:true};
const BPOS=[{x:372,y:142},{x:416,y:122},{x:428,y:162}];
const ESLOT=[{x:112,y:156},{x:50,y:132},{x:165,y:120}];
const ESTAT={
 goblin:{hp:[55,70,85,100,118],atk:[11,14,17,20,23],xp:30,coin:10},
 fox:{hp:[45,57,69,82,96],atk:[9,12,15,17,20],xp:30,coin:12},
 wisp:{hp:[34,43,52,62,72],atk:[7,9,11,13,15],xp:26,coin:9},
 golem:{hp:[95,118,140,165,190],atk:[13,16,19,22,26],xp:48,coin:18},
 guard:{hp:[92,92,92,92,92],atk:[17,17,17,17,17],xp:40,coin:14},
 boss:{hp:[340,450,560,670,880],atk:[15,18,21,25,29],xp:320,coin:90},
 shadow:{hp:[360,360,360,360,360],atk:[22,22,22,22,22],xp:180,coin:40}
};
const QORDER={};
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function nextQuestion(p){
 // 교사가 막 추가한 문제는 다음 필살기에서 먼저 출제
 const pri=takePriority(p);if(pri)return pri;
 const list=questionPool(p);
 const key=String(p)+'|'+poolVersion();if(!QORDER[key]||QORDER[key].length!==list.length)QORDER[key]=shuffleArr(list.map((_,i)=>i));
 const idx=p==='all'?5:p;if(!Array.isArray(S.qptr))S.qptr=[0,0,0,0,0,0];
 const ptr=S.qptr[idx]|0;S.qptr[idx]=ptr+1;
 return list[QORDER[key][ptr%list.length]];
}
function makeEnemy(type,st,extra={}){
 const s=ESTAT[type];const mult=(extra.mult||1)*teacherHpMul();const hp=Math.round(s.hp[st]*mult);
 return {type,st,name:extra.name||ENEMY_NAMES[st][type]||type,hp,max:hp,atk:Math.round(s.atk[st]*(extra.atkMult||1)),
  shield:type==='boss'?3:type==='shadow'?2:0,shieldMax:type==='boss'?3:type==='shadow'?2:0,stun:0,charge:false,turn:0,usedShell:false,usedSimon:0,stole:[],
  flash:0,shake:0,alpha:1,dead:false,slot:0,isBoss:type==='boss'||type==='shadow',quizPool:extra.quizPool??st,sprite:type==='shadow'?'shadow':type,spriteStage:st,xp:s.xp,coin:s.coin};
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function W8(ms){const b=B;if(b)b.lastTick=performance.now();await sleep(ms);if(B!==b||!b||b.over)throw ABORT;b.lastTick=performance.now()}
const aliveE=()=>B.enemies.filter(e=>!e.dead);
const aliveP=()=>partyIdx().filter(i=>S.hp[i]>0);
function bMsg(t){$('#bmsg').textContent=t}
function fl(x,y,text,color,big){floaters.push({x,y,text,color,big,t0:performance.now()})}

// ---------- 시작/종료 ----------
function startBattle(opts){
 if(B||trans||TR)return;
 const st=S.stage;
 if(!aliveP().length)healAll();
 let enemies=[];
 if(opts.kind==='boss'){const b=makeEnemy('boss',st,{quizPool:st===4?'all':st});enemies=[b]}
 else if(opts.kind==='shadow'){const id=opts.id;enemies=[makeEnemy('shadow',4,{name:'그림자 '+ENEMY_NAMES[id].boss,quizPool:id})];enemies[0].shadowOf=id;enemies[0].spriteStage=id}
 else enemies=opts.types.map(tp=>makeEnemy(tp,st,{quizPool:st===4?'all':st}));
 enemies.forEach((e,i)=>{e.slot=i;placeEnemy(e)});
 B={opts,st,enemies,round:1,turnIdx:0,actor:null,waiting:null,mini:null,act:null,eact:null,fx:[],defend:{},vuln:{},guardAll:false,smoke:false,shown:false,over:false,cursor:null,pFlash:[0,0,0],crashes:0,boss:opts.kind==='boss'||opts.kind==='shadow',startXp:S.xp,startLv:level()};
 mode='battle';keys={};path=[];dialog=null;$('#dialog').hidden=true;MENU=null;$('#menuui').hidden=true;
 Music.sfx('encounter');
 const b=B;
 trans={t0:performance.now(),dur:600,kind:'swirl',mid:()=>{if(B!==b)return;b.shown=true;Music.play(b.boss?'boss':'battle');$('#battleui').hidden=false;$('#questbox').hidden=true;bParty();runBattle()}};
}
async function runBattle(){
 const b=B;
 try{await battleMain()}
 catch(err){
  if(err===ABORT||B!==b||!b||b.over)return;
  console.error(err);b.crashes++;b.waiting=null;b.mini=null;b.act=null;b.eact=null;
  if(b.crashes<4){bMsg('(잠깐! 전열을 가다듬었다)');setTimeout(()=>{if(B===b&&!b.over)runBattle()},300)}else endBattle('run');
 }
}
function endBattle(result){
 const b=B;if(!b)return;b.over=true;b.waiting=null;b.mini=null;
 const ent=b.opts.ent;
 trans={t0:performance.now(),dur:500,kind:'fade',mid:()=>{
  $('#battleui').hidden=true;$('#questbox').hidden=false;$('#bcmd').innerHTML='';
  B=null;mode=dialog?'dialog':'field';cooldown=performance.now()+2000;
  if(result==='lose'){const s=startOf(S.stage);pl.x=s[0];pl.y=s[1];pl.dir='down';loadStage()}
  else if(result==='win'){refreshEnts()}
  else if(result==='practice'){}
  else if(ent&&(ent.kind==='mob')){ent.x=ent.hx;ent.y=ent.hy;ent.fx=ent.x;ent.fy=ent.y;ent.t=1}
  else if(ent&&ent.kind==='guard'){/* 도망치면 감시꾼은 제자리에서 다시 순찰 */}
  Music.play('field');save();hud();cv.focus();
 }};
}

// ---------- 질문 패널 ----------
function ask(html,buttons,opt={}){
 return new Promise(resolve=>{B.lastTick=performance.now();B.waiting={html,buttons,opt,resolve:v=>{if(B)B.lastTick=performance.now();resolve(v)},sel:Math.min(opt.sel||0,buttons.length-1)};renderAsk()});
}
function renderAsk(){
 const w=B&&B.waiting;if(!w)return;const el=$('#bcmd');
 el.innerHTML=w.html+`<div class="${w.opt.cols===2?'cmds':w.opt.cols===3?'cmds3':'clist'}">`+w.buttons.map((b,i)=>`<button class="choice${b.cls?' '+b.cls:''}" data-i="${i}" ${b.disabled?'disabled':''}>${b.key?`<kbd>${b.key}</kbd>`:''}${b.label}</button>`).join('')+'</div>';
 el.querySelectorAll('.choice').forEach((btn,i)=>{btn.onclick=()=>askPick(i);btn.onmouseenter=()=>{if(B&&B.waiting===w){w.sel=i;markAsk()}}});
 markAsk();
}
function markAsk(){const w=B&&B.waiting;if(!w)return;$('#bcmd').querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('sel',i===w.sel));const bt=w.buttons[w.sel];B.cursor=bt&&bt.enemy?bt.enemy:null}
function askPick(i){const w=B&&B.waiting;if(!w)return;const b=w.buttons[i];if(!b||b.disabled){Music.sfx('bump');return}B.waiting=null;B.cursor=null;Music.sfx('select');$('#bcmd').innerHTML='';w.resolve(b.value)}
function battleKey(k){
 if(!B)return;
 if(B.mini){B.mini.key(k);return}
 const w=B.waiting;if(!w)return;const n=w.buttons.length,cols=w.opt.cols||1;
 const mv=d=>{w.sel=(w.sel+d+n*4)%n;markAsk();Music.sfx('select')};
 if(k==='ArrowDown'||k==='s'||k==='S')mv(cols);
 else if(k==='ArrowUp'||k==='w'||k==='W')mv(-cols);
 else if(k==='ArrowRight'||k==='d'||k==='D')mv(1);
 else if(k==='ArrowLeft'||k==='a'||k==='A')mv(-1);
 else if(k===' '||k==='Enter')askPick(w.sel);
 else if((k==='Escape'||k==='Backspace')&&w.opt.back){B.waiting=null;B.cursor=null;$('#bcmd').innerHTML='';w.resolve('back')}
 else if(/^[1-9]$/.test(k)&&+k<=n){w.sel=+k-1;markAsk();askPick(+k-1)}
}
function battlePointer(x,y){
 if(!B)return;
 if(B.mini&&B.mini.click){B.mini.click(x,y);return}
 const w=B.waiting;if(!w)return;
 const i=w.buttons.findIndex(b=>b.enemy&&Math.abs(b.enemy.x-x)<26&&y<b.enemy.y+6&&y>b.enemy.y-60);
 if(i>=0)askPick(i);
}
function battleGuard(t){
 if(!B.shown)return;
 if(B.mini||B.waiting||B.over)B.lastTick=t;
 else if(B.lastTick&&t-B.lastTick>8000&&!trans){B.lastTick=t;B.act=null;B.eact=null;console.warn('battle watchdog: restarting turn loop');runBattle()}
 if(B.waiting&&!$('#bcmd').querySelector('.choice'))renderAsk();
 if($('#battleui').hidden){$('#battleui').hidden=false;$('#questbox').hidden=true}
}

// ---------- 상태창 ----------
function bParty(){
 if(!B)return;
 $('#bparty').innerHTML=partyIdx().map(i=>{const hp=S.hp[i],mx=maxHp(i);return `<div class="pm ${hp<=0?'ko':hp<mx*.3?'low':''} ${B.actor===i?'act':''}"><b>${B.actor===i?'▶':''}${MEMBERS[i].name}</b><div class="bar"><i style="transform:scaleX(${Math.max(0,hp)/mx})"></i></div><span>${hp} / ${mx}${B.defend[i]?' 🛡':''}</span></div>`}).join('')+
 `<div class="ki"><span>기력</span><div class="bar"><i style="transform:scaleX(${S.ki/100})"></i></div><span>${S.ki}</span></div>`;
}
function gainKi(n){S.ki=Math.max(0,Math.min(100,S.ki+n))}

// ---------- 메인 흐름 ----------
async function battleMain(){
 const b=B;
 if(!b.introDone){
  b.introDone=true;
  const e0=b.enemies[0];
  const names=b.enemies.length>1?`${e0.name} 외 ${b.enemies.length-1}마리`:e0.name;
  bMsg(`${josa(names,'이/가')} 나타났다!${b.boss?' (강적)':''}`);
  const taunt=e0.type==='shadow'?'…지난 고을에서 배운 것을 기억하느냐…':(TAUNTS[b.st][e0.type]||'');
  const extra=b.boss?`<p class="explain">보호막 ${e0.shieldMax}겹! 「필살기」 정답으로만 깨진다.</p>`:'';
  await ask(`<p class="q"><small>${e0.name}</small>「${taunt}」</p>${extra}`,[{label:'싸운다!',value:'go'}]);
 }
 while(true){
  if(!aliveE().length){await victory();return}
  if(!aliveP().length){await defeat();return}
  const party=aliveP();
  const actor=party[b.turnIdx%party.length];b.turnIdx++;
  b.actor=actor;bParty();
  const res=await playerTurn(actor);
  b.actor=null;bParty();
  if(res==='run'){bMsg('걸음아 날 살려라~! 무사히 도망쳤다.');Music.sfx('door');log('전투에서 물러났다. 다시 다가가면 재도전할 수 있다.');await W8(500);endBattle('run');return}
  if(!aliveE().length){await victory();return}
  await enemyPhase();
  b.defend={};b.vuln={};b.guardAll=false;b.smoke=false;b.round++;bParty();
 }
}
async function playerTurn(a){
 const b=B,st=b.st,sk=SKILLS[a];
 while(true){
  const hpTxt=aliveE().map(e=>`${e.name} ${e.hp}/${e.max}${e.shield?` 🛡${e.shield}`:''}${e.charge?' ⚠강공격 준비':''}${e.stun?' 💫':''}`).join(' · ');
  bMsg(`${MEMBERS[a].name}의 차례 · ${hpTxt}`);
  const cmd=await ask(`<p class="q"><small>${MEMBERS[a].name} · ${WEAPONS[a][S.wpn[a]][0]} (공격 ${atkOf(a)})</small>무엇을 할까? 정답 필살기가 가장 강하다!</p>`,[
   {label:'공격',value:'attack',key:'1'},{label:'필살기 (문제)',value:'quiz',key:'2'},
   {label:`${sk.name} <small>기력 ${sk.cost}</small>`,value:'skill',key:'3',disabled:S.ki<sk.cost},{label:'도구',value:'item',key:'4'},
   {label:'방어',value:'guard',key:'5'},{label:b.boss?'도망 불가':'도망',value:'run',key:'6',disabled:b.boss}
  ],{cols:2});
  if(cmd==='attack'){const t=await pickTarget();if(t==='back')continue;await doAttack(a,t);return}
  if(cmd==='quiz'){const t=await pickTarget();if(t==='back')continue;await doQuiz(a,t);return}
  if(cmd==='skill'){if(S.ki<sk.cost){bMsg('기력이 부족하다! (공격·방어·정답으로 기력이 찬다)');await W8(700);continue}
   let t=null;if(a===1){t=await pickTarget();if(t==='back')continue}
   await doSkill(a,t);return}
  if(cmd==='item'){const r=await pickItem(a);if(r==='back')continue;if(r==='run')return 'run';return}
  if(cmd==='guard'){b.defend[a]=true;gainKi(15);Music.sfx('block');bMsg(`${MEMBERS[a].name}은(는) 방어 자세를 취했다! (받는 피해 절반 · 기력 +15)`);bParty();await W8(650);return}
  if(cmd==='run'){
   if(b.boss){continue}
   const chance=.5+aliveE().filter(e=>e.stun).length*.15;
   if(Math.random()<chance)return 'run';
   bMsg('도망치려 했지만 길이 막혔다!');Music.sfx('wrong');await W8(700);return;
  }
 }
}
async function pickTarget(){
 const list=aliveE();if(list.length===1)return list[0];
 const r=await ask('<p class="q"><small>대상 선택</small>누구를 노릴까? (←→ 또는 적을 클릭)</p>',list.map((e,i)=>({label:`${e.name} ${e.hp}/${e.max}${e.shield?' 🛡'+e.shield:''}`,value:e,enemy:e,key:String(i+1)})).concat([{label:'뒤로',value:'back'}]),{back:true});
 return r;
}

// ---------- 플레이어 행동 ----------
function slashFx(x,y,col='#ffd75e'){for(let i=0;i<12;i++)B.fx.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*4,t0:performance.now(),c:[col,'#fff','#ff7a5a'][i%3]})}
function dmgEnemy(e,amount,o={}){
 if(e.dead)return 0;
 let d=amount;
 if(e.shield>0&&!o.quiz)d=d*(o.pierce?.8:.35);
 if(e.defUp)d*=.6;
 d=Math.max(1,Math.round(d));
 e.hp-=d;if(e.shield>0)e.hp=Math.max(1,e.hp);
 e.flash=1;e.shake=8;fl(e.x,e.y-62,String(d),o.quiz?'#ffd75e':'#fff',o.quiz||d>=40);
 if(e.shield>0&&!o.quiz&&e.hp===1)fl(e.x,e.y-80,'보호막이 버틴다!','#c8b8ff');
 if(e.hp<=0){e.hp=0;e.dead=true;Music.sfx('stun');fl(e.x,e.y-40,DEFEAT_LINES[e.type]||'으악!','#ffe9a8');
  if(e.stole.length){for(const k of e.stole)S.items[k]++;fl(e.x,e.y-20,'훔친 도구를 되찾았다!','#7be38a');e.stole=[]}}
 return d;
}
async function attackAnim(who,target,hit){
 const b=B;b.act={who,target,t0:performance.now(),dur:720,hitAt:330};
 await W8(330);hit();await W8(390);b.act=null;
}
async function doAttack(a,e){
 bMsg(`${MEMBERS[a].name}의 공격!`);
 await attackAnim([a],e,()=>{let d=atkOf(a)*(.85+Math.random()*.3);const crit=Math.random()<.12;if(crit)d*=1.7;Music.sfx('hit');shake=crit?6:3;slashFx(e.x,e.y-30);dmgEnemy(e,d);if(crit)fl(e.x+20,e.y-90,'치명타!','#ff9a6b')});
 gainKi(12);bParty();await W8(250);
}
async function doQuiz(a,e){
 const b=B;const q=nextQuestion(e.quizPool);
 const order=shuffleArr(q[1].map((v,i)=>({v,i})));b.curQ=q;b.curOrder=order;
 let removed=-1;
 let ans;
 while(true){
  const btns=order.map((o,k)=>({label:o.v,value:o.i,key:String(k+1),disabled:o.i===removed}));
  if(S.items.hint>0&&removed<0)btns.push({label:`힌트 부적 쓰기 (${S.items.hint}) — 오답 하나 지우기`,value:'hint',cls:'hintbtn'});
  ans=await ask(`<p class="q"><small>${MEMBERS[a].name}의 필살기 · ${e.shield?`보호막 깨기 (${e.shieldMax-e.shield+1}/${e.shieldMax})`:'정답을 고르세요'}</small>${q[0]}</p>`,btns);
  if(ans==='hint'){S.items.hint--;const wrong=order.filter(o=>o.i!==q[2]);removed=wrong[(Math.random()*wrong.length)|0].i;Music.sfx('chime');continue}
  break;
 }
 if(ans===q[2]){
  S.right++;gainKi(30);recordAnswer(q,true);
  const finale=e.isBoss&&e.shield===1&&aliveP().length>1;
  const who=finale?aliveP():[a];
  const name=finale?`${stages[b.st].power} 합격기 · 다 함께!`:MEMBERS[a].move.replace('{p}',stages[Math.min(b.st,4)].power);
  bMsg(`정답! ${who.map(i=>MEMBERS[i].name).join('·')}의 「${name}」!`);Music.sfx('ok');
  await attackAnim(who,e,()=>{Music.sfx('big');shake=who.length>1?9:6;slashFx(e.x,e.y-34);slashFx(e.x,e.y-34,'#ffffff');
   const d=80+atkOf(a)*1.6+(who.length>1?40:0);
   if(e.shield>0){e.shield--;fl(e.x,e.y-100,'보호막 파괴!','#c8b8ff',true)}
   dmgEnemy(e,d,{quiz:true})});
  bParty();
  await ask(`<p class="q ok"><small>정답!</small>${q[1][q[2]]}</p><p class="explain">${q[3]}</p>`,[{label:'계속',value:1}]);
 } else {
  S.wrong++;gainKi(5);recordAnswer(q,false);b.vuln[a]=true;Music.sfx('wrong');shake=3;
  bMsg(`앗, 기술이 꼬였다! ${MEMBERS[a].name}이(가) 비틀거린다 (이번 턴 받는 피해 증가)`);
  await ask(`<p class="q ng"><small>오답…</small>다시 생각해 보자!</p><p class="explain">💡 ${q[3]}</p>`,[{label:'계속',value:1}]);
 }
 save();
}
async function doSkill(a,t){
 const b=B,sk=SKILLS[a];S.ki-=sk.cost;bParty();
 bMsg(`${MEMBERS[a].name}의 「${sk.name}」!`);Music.sfx('ok');
 if(a===0){await attackAnim([0],'all',()=>{Music.sfx('big');shake=6;for(const e of aliveE()){slashFx(e.x,e.y-30);dmgEnemy(e,atkOf(0)*1.3*(.9+Math.random()*.2))}})}
 else if(a===1){await attackAnim([1],t,()=>{Music.sfx('big');shake=5;slashFx(t.x,t.y-30,'#7be3ff');dmgEnemy(t,atkOf(1)*2.4,{pierce:true})})}
 else {b.guardAll=true;aliveP().forEach(i=>{const h=Math.round(maxHp(i)*.15);S.hp[i]=Math.min(maxHp(i),S.hp[i]+h);fl(BPOS[i].x,BPOS[i].y-40,'+'+h,'#7be38a')});Music.sfx('heal');bMsg('곰돌 방패! 이번 턴 받는 피해가 크게 줄고 일행이 회복했다.');bParty();hud();await W8(700)}
 bParty();await W8(250);
}
async function pickItem(a){
 const b=B;
 const btns=ITEM_ORDER.map(k=>{const usable=!['hint','charm'].includes(k);return {label:`${ITEMS[k].name} ×${S.items[k]} <small>${usable?ITEMS[k].desc:(k==='hint'?'필살기 문제 중에 사용':'강공격 때 자동 발동')}</small>`,value:k,disabled:S.items[k]<=0||!usable}});
 btns.push({label:'뒤로',value:'back'});
 const k=await ask('<p class="q"><small>도구</small>무엇을 쓸까?</p>',btns,{back:true});
 if(k==='back')return 'back';
 S.items[k]--;Music.sfx('select');
 if(k==='potion'){aliveP().forEach(i=>{S.hp[i]=Math.min(maxHp(i),S.hp[i]+60);fl(BPOS[i].x,BPOS[i].y-40,'+60','#7be38a')});Music.sfx('heal');bMsg('회복약을 나눠 마셨다! 일행 체력 +60')}
 else if(k==='rice'){const ko=partyIdx().filter(i=>S.hp[i]<=0);const i=ko.length?ko[0]:aliveP().sort((x,y)=>S.hp[x]/maxHp(x)-S.hp[y]/maxHp(y))[0];const h=Math.round(maxHp(i)*.6);S.hp[i]=Math.min(maxHp(i),S.hp[i]+h);fl(BPOS[i].x,BPOS[i].y-40,'+'+h,'#7be38a');Music.sfx('heal');bMsg(`우정 떡! ${MEMBERS[i].name}이(가) 힘을 되찾았다.`)}

async function enemyPhase(){

 }

 // 베기
 if(pa){const el=t-pa.t0;if(el>pa.hitAt-60&&el<pa.hitAt+260){const k=(el-pa.hitAt+60)/320;const tg=pa.target==='all'?{x:110,y:150}:pa.target;ctx.save();ctx.translate(tg.x,tg.y-30);ctx.strokeStyle=`rgba(255,255,255,${1-k})`;ctx.lineWidth=4;for(let j=0;j<Math.max(1,pa.who.length);j++){ctx.beginPath();ctx.arc(0,0,22+k*20+j*6,-1.2+j*.6,.6+k*1.2+j*.6);ctx.stroke()}ctx.restore()}}

<script>// 평등의 나라 · 취풍 무협전 — 필드(장별 미션) · 공통 UI · 입력 · 메인 루프

let mode='title',grid=null,mapImg=null,ENTS=[],keys={},path=[],pendingTarget=null,cooldown=0,now=0,trans=null,dialog=null,shake=0,floaters=[],followers=[],tapDir=null,lastBump=0,explored=null,MENU=null,alertT=0;

function save(){try{S.x=pl.x;S.y=pl.y;S.dir=pl.dir;if(explored)S.explored=packExplored();localStorage.setItem(KEY,JSON.stringify(S));$('#savestatus').textContent='진행 자동 저장됨'}catch{$('#savestatus').textContent='저장 불가 · 이 창을 유지하세요'}}

function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296}
const F=()=>S.flags;

// ================= 미로(2장) =================
let MAZE=null;
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genMaze(){
 if(MAZE)return MAZE;
 const r=rng(20261102),g=Array.from({length:H},()=>Array(W).fill('#'));
 const inRoom=(x,y)=>x>=21&&y<=7;
 const cells=[];for(let y=1;y<H-1;y+=2)for(let x=1;x<W-2;x+=2)if(!inRoom(x,y))cells.push([x,y]);

 }
 for(let i=0;i<16;i++){const [x,y]=cells[(r()*cells.length)|0];const [dx,dy]=[[2,0],[0,2]][(r()*2)|0];const nx=x+dx,ny=y+dy;if(nx<=27&&ny<=17&&!inRoom(nx,ny))g[y+dy/2][x+dx/2]='.'}

 for(let y=0;y<H;y++){g[y][0]='#';g[y][W-1]='#'}for(let x=0;x<W;x++){g[0][x]='#';g[H-1][x]='#'}
 // 시작점 기준 거리
 const dist={},q=[[2,17]];dist[key(2,17)]=0;
 while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(g[ny]&&g[ny][nx]&&g[ny][nx]!=='#'&&g[ny][nx]!=='D'&&dist[key(nx,ny)]==null){dist[key(nx,ny)]=dist[key(x,y)]+1;q.push([nx,ny])}}}
 const open=(x,y)=>g[y]&&g[y][x]&&g[y][x]!=='#'&&g[y][x]!=='D';
 const deg=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>open(x+dx,y+dy)).length;

 const pickSpread=(list,n,minD,taken)=>{const out=[];for(const p of list){if(out.length>=n)break;if([...out,...taken].every(o=>Math.abs(o[0]-p[0])+Math.abs(o[1]-p[1])>=minD))out.push(p)}return out};
 const frags=pickSpread(ends,3,9,[]);
 const chests=pickSpread(ends.filter(p=>!frags.includes(p)),3,6,frags);
 const corr=Object.keys(dist).map(k=>k.split(',').map(Number)).filter(([x,y])=>dist[key(x,y)]>=7&&!(x<=6&&y>=14)&&deg(x,y)===2&&!(Math.abs(x-25)+Math.abs(y-9)<2));
 corr.sort((a,b)=>hash(a[0],a[1],7)-hash(b[0],b[1],7));
 const mobs=pickSpread(corr,6,7,[...frags,...chests]);
 MAZE={grid:g,start:[2,17],npc:[4,16],shop:[1,15],villagers:[],frags,chests,mobs,stele:[23,6],trial:[27,6],boss:[25,3],gate:[28,1],door:[25,8]};
 return MAZE;
}

// ================= 지도·문 =================
function layoutOf(st){return st===1?genMaze():LAYOUT[st]}
function buildGrid(st){return st===1?genMaze().grid.map(r=>r.slice()):MAPS[st].map(r=>r.split(''))}
function doorOpenAt(x,y){
 const st=S.stage;
 if(st===1)return fragCount()>=3;
 if(st===2){const i=LAYOUT[2].pens.findIndex(p=>p.door[0]===x&&p.door[1]===y);return i>=0&&penSolved(i)}
 if(st===3)return bellsDone();
 if(st===4)return S.trial;
 return false;
}
function tileSolid(x,y){if(x<0||y<0||x>=W||y>=H)return true;const c=grid[y][x];if(c==='D')return !doorOpenAt(x,y);return c==='#'||c==='~'||c==='H'||c==='W'}
function walkable(x,y,ignoreEnt){if(tileSolid(x,y))return false;if(ignoreEnt)return true;return !entAt(x,y)}
function entAt(x,y){for(const e of ENTS)if(!e.gone&&e.x===x&&e.y===y)return e;return null}
function bfs(start,goal,adjOK){
 const q=[start],seen=new Set([start.join()]),prev={};
 while(q.length){const p=q.shift();
  const done=adjOK?Math.abs(p[0]-goal[0])+Math.abs(p[1]-goal[1])===1:(p[0]===goal[0]&&p[1]===goal[1]);
  if(done){const out=[];let k=p.join();while(k!==start.join()){out.unshift(k.split(',').map(Number));k=prev[k]}return out}
  for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const x=p[0]+dx,y=p[1]+dy,k=x+','+y;if(!seen.has(k)&&walkable(x,y)){seen.add(k);prev[k]=p.join();q.push([x,y])}}
 }
 return null;
}

function penSolved(i){const pen=LAYOUT[2].pens[i];const bp=boulderPos(i);return pen.plates.every(p=>bp.some(b=>b[0]===p[0]&&b[1]===p[1]))}
function boulderPos(i){const bp=S.flags.bpos||(S.flags.bpos={});if(!bp[i])bp[i]=LAYOUT[2].pens[i].boulders.map(b=>b.slice());return bp[i]}
function missionDone(){

function buildEntities(){
 const st=S.stage,L=layoutOf(st),E=[];
 const add=(kind,p,extra={})=>E.push({kind,x:p[0],y:p[1],...extra});
 add('npc',L.npc);add('shop',L.shop);
 (L.villagers||[]).forEach((p,i)=>add('villager',p,{id:i}));
 if(st===0)LAYOUT[0].items.forEach((p,i)=>{if(!flagArr('letters').includes(i))add('letter',p,{id:i})});
 if(st===1)L.frags.forEach((p,i)=>{if(!flagArr('frags').includes(i))add('frag',p,{id:i})});
 (L.chests||[]).forEach((p,i)=>{if(CHESTS[st][i])add('chest',p,{id:i,open:flagArr('chests').includes(i)})});
 (L.mobs||[]).forEach((p,i)=>{if(!S.kills.includes('m'+i)&&STAGE_MOBS[st][i])add('mob',p,{id:'m'+i,types:STAGE_MOBS[st][i],hx:p[0],hy:p[1],fx:p[0],fy:p[1],t:1,next:0})});
 if(st===2)LAYOUT[2].pens.forEach((pen,i)=>{
  if(!flagArr('freed').includes(i))add('friend',pen.friend,{id:i});
  add('sign',pen.sign,{id:i});
  boulderPos(i).forEach((b,j)=>add('boulder',b,{pen:i,j}));
 });
 if(st===3){LAYOUT[3].bells.forEach((p,i)=>add('bell',p,{id:i}));
  LAYOUT[3].guards.forEach((r,i)=>{if(!S.kills.includes('g'+i))add('guard',r[0],{id:'g'+i,route:r,dirSign:1,fx:r[0][0],fy:r[0][1],t:1,next:0,face:r[0][0]===r[1][0]?(r[1][1]>r[0][1]?'down':'up'):(r[1][0]>r[0][0]?'right':'left')})})}
 if(st===4)LAYOUT[4].shadows.forEach((p,i)=>{if(!flagArr('keys').includes(i))add('shadow',p,{id:i})});
 add('stele',L.stele);add('trial',L.trial);
 if(!S.boss)add('boss',L.boss);
 add('gate',L.gate);
 return E;
}

function packExplored(){if(!explored)return '';let s='';for(let i=0;i<explored.length;i+=4)s+=((explored[i]|explored[i+1]<<1|explored[i+2]<<2|explored[i+3]<<3)).toString(16);return s}
function unpackExplored(s){const a=new Uint8Array(W*H);if(s)for(let i=0;i<s.length;i++){const v=parseInt(s[i],16)||0;for(let b=0;b<4;b++)if(i*4+b<a.length)a[i*4+b]=(v>>b)&1}return a}
const visionR=()=>S.lantern?5.2:3.4;
function reveal(){if(!explored)return;const r=visionR();for(let y=0;y<H;y++)for(let x=0;x<W;x++)if((x-pl.x)**2+(y-pl.y)**2<=r*r)explored[y*W+x]=1}

   if(v==='W'){px(X,Y,T,T,'#4a3a4a');px(X,Y,T,4,'#6a5a6a');for(let i=0;i<T;i+=8)px(X+i+((y%2)*4),Y+4,1,12,'#2a1a2a');px(X,Y+10,T,1,'#2a1a2a')}
   if(v==='#'){drawTree(g,X,Y,th,stage,x,y)}
   continue}
  const gc=th.grass;px(X,Y,T,T,gc[0]);
  for(let i=0;i<5;i++){const r=hash(x,y,i);const r2=hash(y,x,i+3);px(X+((r*15)|0),Y+((r2*15)|0),1,1,i%2?gc[1]:gc[2])}
  if(hash(x,y,99)<.25){px(X+5,Y+9,1,2,gc[1]);px(X+7,Y+8,1,3,gc[1]);px(X+9,Y+9,1,2,gc[1])}
  if(v===':'){px(X,Y,T,T,th.path);for(let i=0;i<4;i++){const r=hash(x,y,i+20),r2=hash(y,x,i+30);px(X+((r*14)|0),Y+((r2*14)|0),2,1,th.pathD)}
   for(const [dx,dy,ex,ey,ew,eh] of [[0,-1,0,0,T,1],[0,1,0,T-1,T,1],[-1,0,0,0,1,T],[1,0,T-1,0,1,T]]){const n=at(x+dx,y+dy);if(n!==':'&&n!=='='&&n!=null)px(X+ex,Y+ey,ew,eh,th.pathD)}}

 let px=pl.x,py=pl.y;for(const f of followers){const ox=f.x,oy=f.y;f.fx=f.x;f.fy=f.y;f.x=px;f.y=py;px=ox;py=oy}

function drawTrans(t){

 if(k>=.5&&!trans.done){trans.done=true;try{trans.mid&&trans.mid()}catch(err){console.error(err)}}
 if(k>=1){trans=null;return}
 const v=k<.5?k*2:2-k*2;
 if(trans.kind==='swirl'){ctx.fillStyle='#000';const n=12;for(let i=0;i<n;i++){const h=320/n;ctx.fillRect(i%2?480*(1-v):0,i*h,480*v,h)}if(k<.5){ctx.fillStyle=`rgba(255,255,255,${Math.max(0,.6-k*2)})`;ctx.fillRect(0,0,480,320)}}
 else{ctx.fillStyle=`rgba(0,0,0,${v})`;ctx.fillRect(0,0,480,320)}
}
function drawFloaters(t){

let last=performance.now();
function guard(t){
 if(mode==='title')return;
 const dlg=$('#dialog'),bui=$('#battleui');
 if(mode==='dialog'&&!dialog)mode='field';
 if(dialog&&mode==='field'&&!trans)mode='dialog';
 if(!dialog&&!dlg.hidden)dlg.hidden=true;
 if(dialog&&dlg.hidden)dlg.hidden=false;
 if(mode==='menu'&&!MENU)mode='field';
 if(!MENU&&!$('#menuui').hidden)$('#menuui').hidden=true;
 if(MENU&&mode!=='menu'){MENU=null;$('#menuui').hidden=true}
 if(mode!=='battle'&&!B&&!trans&&!bui.hidden){bui.hidden=true;$('#questbox').hidden=false}
 if(mode==='battle'&&!B&&!trans){mode='field';bui.hidden=true;$('#questbox').hidden=false;cooldown=t+1500}
 if(mode==='battle'&&B&&!trans)battleGuard(t);
 if(mode==='trial'&&!TR&&!trans){mode='field';$('#trialui').hidden=true;$('#questbox').hidden=false}
 if(mode!=='trial'&&TR&&!trans){TR=null;$('#trialui').hidden=true}
 if(mode!=='trial'&&!TR&&!$('#trialui').hidden)$('#trialui').hidden=true;
 if(TR&&TR.menu&&$('#trialui').hidden)$('#trialui').hidden=false;
 if(mode==='field'&&pl.t>=1&&grid&&tileSolid(pl.x,pl.y)){const s=startOf(S.stage);pl.x=s[0];pl.y=s[1];pl.fx=pl.x;pl.fy=pl.y}
}
function frame(t){
 requestAnimationFrame(frame);
 try{
  const dt=Math.min(50,t-last);last=t;now=t;
  guard(t);
  if(mode==='field'&&!trans&&!$('#modal').open){updateField(dt);updateMobs(t,dt)}
  if(mode==='field'||mode==='dialog'||mode==='menu'){for(const m of ENTS)if((m.kind==='mob'||m.kind==='guard')&&m.t<1)m.t=Math.min(1,m.t+dt/260)}
  if(mode==='dialog'){updateDialog();if(pl.t<1)pl.t=Math.min(1,pl.t+dt/STEP_MS)}
  if(mode==='battle'&&B)updateBattle(t,dt);
  if(mode==='trial'&&TR&&!trans&&!$('#modal').open)trialUpdate(dt/1000);
  ctx.save();
  try{
   if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.4)shake=0}
   if(mode==='trial'&&TR&&TR.shown)drawTrial(t);
   else if(mode==='battle'&&B&&B.shown)drawBattle(t);
   else if(grid)drawField(t);
   drawFloaters(t);
  }finally{ctx.restore()}
  drawTrans(t);
 }catch(err){console.error(err)}
}

}

 if(mode==='trial'){if(trans&&!(TR&&TR.menu))return;if(/^(Arrow(Up|Down|Left|Right)|[wasdWASD])$/.test(k))keys[k]=true;if(!ev.repeat)trialKey(k);return}

 if(mode==='menu'){if(!ev.repeat)menuKey(k);return}
 if(k===' '||k==='Enter'){if(!ev.repeat)act();return}
 if(mode==='dialog')return;

<script>// 교사용 기능: 진행 이동 · 연습(진행 불변) · 난이도/무적 · 문제 관리 · 학생용 링크/파일 · 학습 기록
const CLASS_KEY=window.CLASS_STORE_KEY||'equality-rpg-class-v1',TEACH_KEY='equality-rpg-teacher-v1';
const BASE_QS=stages.map((s,si)=>s.qs.map((q,qi)=>[q[0],q[1],q[2],q[3],`b${si}-${qi}`]));
const DIFF={easy:{hp:.8,dmg:.6,drift:.75,speed:.95,hearts:1,name:'쉬움'},normal:{hp:1,dmg:1,drift:1,speed:1,hearts:0,name:'보통'},hard:{hp:1.2,dmg:1.3,drift:1.12,speed:1.05,hearts:0,name:'어려움'}};
const REC=[{xp:0,wpn:[0,0,0]},{xp:950,wpn:[1,0,0]},{xp:2000,wpn:[1,1,1]},{xp:3300,wpn:[2,1,1]},{xp:4800,wpn:[2,2,2]}];

function escH(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadJSON(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function defaultClass(){return {v:1,mode:'add',difficulty:'normal',startStage:null,questions:[]}}
function newId(){return Math.random().toString(36).slice(2,10)}
function cleanQuestion(q){
 if(!q||typeof q!=='object')return null;
 const text=String(q.text??'').trim().slice(0,240);
 const choices=Array.isArray(q.choices)?q.choices.map(c=>String(c??'').trim().slice(0,100)).filter(Boolean).slice(0,4):[];
 const answer=Number(q.answer);
 const stage=q.stage==='all'?'all':Number(q.stage);
 if(!text||choices.length<2||!Number.isInteger(answer)||answer<0||answer>=choices.length)return null;
 if(!(stage==='all'||(Number.isInteger(stage)&&stage>=0&&stage<5)))return null;
 const explain=String(q.explain??'').trim().slice(0,300);
 const id=String(q.id||'').replace(/[^a-z0-9]/gi,'').slice(0,16)||newId();
 return {id,stage,text,choices,answer,explain};
}
function cleanClass(c){
 const d=defaultClass();if(!c||typeof c!=='object')return d;
 d.mode=c.mode==='only'?'only':'add';
 d.difficulty=Object.prototype.hasOwnProperty.call(DIFF,c.difficulty)?c.difficulty:'normal';
 d.startStage=Number.isInteger(c.startStage)&&c.startStage>=0&&c.startStage<5?c.startStage:null;
 const seen=new Set();
 d.questions=(Array.isArray(c.questions)?c.questions:[]).slice(0,200).map(cleanQuestion).filter(q=>q&&!seen.has(q.id)&&seen.add(q.id));
 return d;
}
let CLS=cleanClass(loadJSON(CLASS_KEY)),TEA=(()=>{const t=loadJSON(TEACH_KEY)||{};return {pin:typeof t.pin==='string'&&/^\d{4,8}$/.test(t.pin)?t.pin:'1234',god:!!t.god}})();

function customArr(q){return [escH(q.text),q.choices.map(escH),q.answer,escH(q.explain||'선생님이 낸 문제예요.'),'c'+q.id]}
function questionPool(p){
 const sts=p==='all'?[0,1,2,3,4]:[p];const out=[],ids=new Set();
 const add=a=>{if(!ids.has(a[4])){ids.add(a[4]);out.push(a)}};
 for(const s of sts){const cus=CLS.questions.filter(q=>q.stage===s||q.stage==='all');
  if(!(CLS.mode==='only'&&cus.length))BASE_QS[s].forEach(add);
  cus.forEach(q=>add(customArr(q)))}
 return out.length?out:BASE_QS[p==='all'?0:p];
}

function takePriority(p){const i=PRIORITY.findIndex(q=>p==='all'||q.stage===p||q.stage==='all');if(i<0)return null;return customArr(PRIORITY.splice(i,1)[0])}
function recordAnswer(q,ok){const id=q&&q[4]||'?';if(!S.qstats||typeof S.qstats!=='object'||Array.isArray(S.qstats))S.qstats={};const r=Array.isArray(S.qstats[id])?S.qstats[id]:(S.qstats[id]=[0,0]);r[ok?0:1]++}
function questionById(id){
 if(id.startsWith('b')){const [s,i]=id.slice(1).split('-').map(Number);const q=BASE_QS[s]&&BASE_QS[s][i];return q?{text:q[0],stage:s,custom:false}:null}

}

function teacherReportText(){

 const miss=Object.entries(S.qstats||{}).filter(([,r])=>r[1]>0).sort((a,b)=>b[1][1]-a[1][1]).slice(0,5).map(([id,r])=>{const q=questionById(id);return q?`- ${q.text} (틀림 ${r[1]}·맞힘 ${r[0]})`:null}).filter(Boolean);
 return `정답률 ${rate}% (정답 ${S.right} · 오답 ${S.wrong})${miss.length?'\n다시 볼 문제:\n'+miss.join('\n'):''}`;
}

function b64u(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function packClass(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 if(typeof CompressionStream==='function'){try{const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}catch{}}

}
async function unpackClass(s){
 const bytes=unb64u(s.slice(1));
 if(s[0]==='z'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(ds).text())}

}

 if(c.startStage!=null&&S.stage<c.startStage&&!S.finished){teacherJumpQuiet(c.startStage);msg+=` · ${STAGE_LABEL(c.startStage)}부터 시작`}
 return msg;
}

function msg(id,t,ok=true){const e=$(id);if(e){e.textContent=t;e.className='tmsg '+(ok?'ok':'ng')}}
function readForm(){
 const choices=[0,1,2,3].map(i=>$('#q-c'+i).value.trim());
 let answer=+((document.querySelector('input[name="q-ans"]:checked')||{}).value||0);
 // 빈 보기를 빼고 정답 번호를 맞춤
 const kept=[];let ans=-1;choices.forEach((c,i)=>{if(c){if(i===answer)ans=kept.length;kept.push(c)}});
 const st=$('#q-st').value;
 return {id:EDITING||newId(),stage:st==='all'?'all':+st,text:$('#q-text').value,choices:kept,answer:ans,explain:$('#q-exp').value};
}
function parseBulk(text){
 const ok=[],bad=[];
 text.split(/\r?\n/).forEach((line,n)=>{if(!line.trim())return;
  const p=line.split('|').map(s=>s.trim());
  const stTxt=(p[0]||'').replace(/장/,'');const stage=/^(전체|모든|all|0)$/i.test(stTxt)?'all':(+stTxt)-1;
  const q=cleanQuestion({stage,text:p[1],choices:(p[2]||'').split('/').map(s=>s.trim()),answer:(+p[3])-1,explain:p[4]||''});
  if(q)ok.push(q);else bad.push(n+1)});
 return {ok,bad};
}

  $('#s-import').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>500000){msg('#s-fmsg','파일이 너무 커요.',false);return}
